<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПХК Феникс - Premium</title>
    <style>
        :root {
            --primary: #ff5500;
            --primary-glow: rgba(255, 85, 0, 0.6);
            --bg-dark: #050301;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); color: var(--text-main); 
            min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed;
        }

        /* Фоновые свечения */
        .ambient-glow { position: fixed; width: 350px; height: 350px; background: var(--primary); filter: blur(120px); border-radius: 50%; opacity: 0.25; z-index: -1; pointer-events: none; }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 10%; right: -150px; background: var(--primary); opacity: 0.2; }

        /* Шапка */
        .header { 
            display: flex; justify-content: center; align-items: center; 
            padding: 15px 20px 10px; position: sticky; top: 0; z-index: 100;
            background: linear-gradient(180deg, rgba(5,3,1,0.98) 0%, rgba(5,3,1,0) 100%);
            height: 95px;
        }
        .logo-img-main { height: 80px; width: auto; object-fit: contain; filter: drop-shadow(0 0 15px var(--primary-glow)); }
        .fallback-logo { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--primary-glow); letter-spacing: 2px; align-items: center; display: none; }
        
        .admin-btn-header { 
            position: absolute; right: 20px; top: 25px;
            height: 40px; width: 40px; border-radius: 50%; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); font-size: 18px; cursor: pointer; color: #fff;
            transition: 0.3s;
        }

        /* Верхняя навигация */
        .top-nav { display: flex; gap: 12px; overflow-x: auto; padding: 10px 20px 20px; scrollbar-width: none; z-index: 99; position: relative; }
        .top-nav::-webkit-scrollbar { display: none; }
        .tab-pill { 
            background: var(--glass-bg); color: var(--text-muted); border: 1px solid var(--glass-border); 
            padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; 
            cursor: pointer; white-space: nowrap; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .tab-pill.active { 
            background: rgba(0,0,0,0.6); color: var(--text-main); border-color: var(--primary); 
            box-shadow: inset 0 0 15px rgba(255,255,255,0.02), 0 0 12px var(--primary-glow);
        }

        /* Экраны */
        .screen { display: none; padding: 0 20px 40px; animation: scaleIn 0.3s ease-out; }
        .screen.active { display: block; }
        @keyframes scaleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточки контента */
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }

        /* Новости */
        .featured-news { padding: 0; min-height: 240px; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; border: 1px solid var(--primary); }
        .featured-overlay { background: linear-gradient(0deg, #000 0%, transparent 100%); padding: 25px 20px; border-radius: 0 0 28px 28px; }
        .news-date { font-size: 11px; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .news-title { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
        .news-text { font-size: 14px; color: #ccc; line-height: 1.4; }

        /* Календарь */
        .match-header { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .team-block { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .team-logo { width: 55px; height: 55px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 26px; border: 1px solid var(--glass-border); overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
        .team-name { font-size: 13px; font-weight: 700; text-align: center; }
        
        .score-block { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .score-pill { 
            background: rgba(0,0,0,0.6); border: 1px solid var(--primary); border-radius: 20px; 
            padding: 8px 24px; font-size: 26px; font-weight: 900; 
            box-shadow: 0 0 20px var(--primary-glow); margin-bottom: 6px;
        }
        .match-time { font-size: 12px; color: var(--primary); font-weight: 700; }

        /* Магазин */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .shop-img { width: 80px; height: 80px; margin-bottom: 12px; object-fit: contain; font-size: 55px; line-height: 80px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        .shop-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #eee; }
        .shop-price { font-size: 17px; font-weight: 900; color: var(--primary); }

        /* Поле (Состав) */
        .field { 
            background: linear-gradient(180deg, #16181f 0%, #0d0e12 100%);
            border: 2px solid var(--glass-border); border-radius: 28px; 
            height: 520px; position: relative; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9); margin-top: 10px;
        }
        .line-center { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.15); transform: translateY(-50%); }
        .circle-center { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal-area { position: absolute; left: 50%; width: 140px; height: 45px; border: 2px solid rgba(255,255,255,0.15); transform: translateX(-50%); }
        .goal-top { top: -2px; border-top: none; border-radius: 0 0 25px 25px; }
        .goal-bottom { bottom: -2px; border-bottom: none; border-radius: 25px 25px 0 0; }

        .player-card { 
            width: 72px; height: 110px; 
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            border: 1px solid var(--primary); border-radius: 12px; 
            position: absolute; transform: translate(-50%, -50%); 
            display: flex; flex-direction: column; align-items: center; padding: 6px 4px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .card-rating { font-size: 19px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 0 10px var(--primary-glow); }
        .card-pos { font-size: 10px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .card-photo { width: 44px; height: 44px; background: #222; border-radius: 50%; background-size: cover; background-position: center; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.3); }
        .card-name { font-size: 10px; font-weight: 700; color: #eee; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        .pos-c { top: 22%; left: 50%; } .pos-lw { top: 38%; left: 22%; } .pos-rw { top: 38%; left: 78%; }
        .pos-ld { top: 68%; left: 28%; } .pos-rd { top: 68%; left: 72%; } .pos-gk { top: 88%; left: 50%; }

        /* Админ панель */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(20px); }
        .modal-overlay.active { display: flex; animation: scaleIn 0.2s; }
        .modal-content { background: linear-gradient(145deg, #1a1c23 0%, #111216 100%); width: 100%; max-width: 420px; border-radius: 32px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .admin-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 5px; scrollbar-width: none; }
        .admin-tabs::-webkit-scrollbar { display: none; }
        .admin-tab { background: #000; border: 1px solid #333; color: #888; padding: 12px 16px; border-radius: 14px; white-space: nowrap; cursor: pointer; transition: 0.3s; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .admin-tab.active { background: rgba(255,85,0,0.15); color: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 10px rgba(255,85,0,0.1); }

        .admin-input { width: 100%; padding: 16px; background: #08090b; color: #fff; border: 1px solid #2a2d35; border-radius: 16px; margin-bottom: 15px; font-size: 14px; transition: 0.3s; }
        .admin-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,85,0,0.2); outline: none; }
        .input-row { display: flex; gap: 10px; }
        
        /* Стили для кнопок выбора файла */
        input[type="file"] { padding: 12px; background: #08090b; color: #888; font-size: 12px; }
        input[type="file"]::-webkit-file-upload-button { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; margin-right: 12px; font-weight: bold; }
        .file-label { color: var(--text-muted); font-size: 12px; margin-bottom: 6px; display: block; padding-left: 5px; font-weight: 600; }

        .admin-btn-save { background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; box-shadow: 0 10px 20px rgba(255,85,0,0.3); transition: 0.3s; }
        .admin-btn-save:active { transform: translateY(2px); box-shadow: 0 5px 10px rgba(255,85,0,0.3); }
        .admin-btn-danger { background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid rgba(255,0,0,0.3); padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 15px; }
        
        .form-group { display: none; animation: scaleIn 0.2s; }
        .form-group.active { display: block; }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1" id="glow1"></div>
    <div class="ambient-glow glow-2" id="glow2"></div>

    <header class="header">
        <img src="1335.jpg" alt="ФЕНИКС" class="logo-img-main" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
        <div id="fallbackLogo" class="fallbackLogo fallback-logo">🦅 ФЕНИКС</div>
        <button class="admin-btn-header" onclick="openAdmin()">⚙️</button>
    </header>

    <nav class="top-nav">
        <button class="tab-pill active" onclick="switchTab('news', this)">Главная</button>
        <button class="tab-pill" onclick="switchTab('calendar', this)">Календарь</button>
        <button class="tab-pill" onclick="switchTab('squad', this)">Состав</button>
        <button class="tab-pill" onclick="switchTab('shop', this)">Магазин</button>
    </nav>

    <div id="screen-news" class="screen active"><div id="newsContainer"></div></div>
    <div id="screen-calendar" class="screen"><div id="calendarContainer"></div></div>
    <div id="screen-squad" class="screen">
        <div class="field" id="fieldContainer">
            <div class="line-center"></div><div class="circle-center"></div>
            <div class="goal-area goal-top"></div><div class="goal-area goal-bottom"></div>
        </div>
    </div>
    <div id="screen-shop" class="screen"><div class="shop-grid" id="shopContainer"></div></div>

    <!-- Админ-панель (Теперь с загрузкой файлов из галереи) -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #fff; font-size: 20px; font-weight: 800;">Управление клубом</h3>
                <button class="close-btn" onclick="closeAdmin()">×</button>
            </div>
            
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="setAdminForm('form-news', this)">📰 Новость</button>
                <button class="admin-tab" onclick="setAdminForm('form-match', this)">📅 Матч</button>
                <button class="admin-tab" onclick="setAdminForm('form-player', this)">🏒 Игрок</button>
                <button class="admin-tab" onclick="setAdminForm('form-shop', this)">🛒 Товар</button>
                <button class="admin-tab" onclick="setAdminForm('form-settings', this)">🎨 Дизайн</button>
            </div>

            <!-- Формы -->
            <div id="form-news" class="form-group active">
                <input type="text" id="nTitle" class="admin-input" placeholder="Заголовок новости">
                <textarea id="nText" class="admin-input" placeholder="Текст новости" rows="3"></textarea>
                <label class="file-label">Фото (из галереи):</label>
                <input type="file" id="nImgFile" class="admin-input" accept="image/*">
            </div>

            <div id="form-match" class="form-group">
                <input type="text" id="mOpponent" class="admin-input" placeholder="Команда соперника">
                <input type="text" id="mDate" class="admin-input" placeholder="Дата и время (напр. 20 Окт, 18:00)">
                <div class="input-row">
                    <input type="number" id="mScoreF" class="admin-input" placeholder="Голы Феникс">
                    <input type="number" id="mScoreO" class="admin-input" placeholder="Голы Соперник">
                </div>
                <label class="file-label">Логотип соперника (из галереи):</label>
                <input type="file" id="mLogoOFile" class="admin-input" accept="image/*">
            </div>

            <div id="form-player" class="form-group">
                <input type="text" id="pName" class="admin-input" placeholder="Фамилия игрока">
                <div class="input-row">
                    <input type="number" id="pRating" class="admin-input" placeholder="Рейтинг (0-99)">
                    <select id="pPos" class="admin-input" style="margin-bottom:0;">
                        <option value="pos-c">ЦН (Центр)</option>
                        <option value="pos-lw">ЛН (Лев. нап)</option>
                        <option value="pos-rw">ПН (Прав. нап)</option>
                        <option value="pos-ld">ЛЗ (Лев. защ)</option>
                        <option value="pos-rd">ПЗ (Прав. защ)</option>
                        <option value="pos-gk">ВР (Вратарь)</option>
                    </select>
                </div>
                <label class="file-label" style="margin-top:10px;">Фото игрока (из галереи):</label>
                <input type="file" id="pPhotoFile" class="admin-input" accept="image/*">
            </div>

            <div id="form-shop" class="form-group">
                <input type="text" id="sName" class="admin-input" placeholder="Название товара">
                <input type="text" id="sPrice" class="admin-input" placeholder="Цена (напр. 1500 ₽)">
                <input type="text" id="sEmoji" class="admin-input" placeholder="Эмодзи (например 👕)">
                <label class="file-label">ИЛИ фото товара (из галереи):</label>
                <input type="file" id="sImgFile" class="admin-input" accept="image/*">
            </div>

            <div id="form-settings" class="form-group">
                <label class="file-label">Главный цвет приложения:</label>
                <input type="color" id="gColor" class="admin-input" style="height: 50px; padding: 5px;">
                <label class="file-label">Фоновая картинка (из галереи):</label>
                <input type="file" id="gBgFile" class="admin-input" accept="image/*">
                
                <button class="admin-btn-danger" style="margin-top:5px; background: transparent; border: 1px solid #555; color: #888;" onclick="clearBg()">Очистить фон</button>
                <button class="admin-btn-danger" onclick="clearAllData()">🗑️ Сбросить базу до заводских</button>
            </div>

            <button class="admin-btn-save" onclick="saveData()">💾 Сохранить изменения</button>
        </div>
    </div>

    <script>
        let currentAdminForm = 'form-news';

        // База данных
        const defaults = {
            news: [
                { date: "Вчера", title: "Стена в воротах", text: "Голкипер Давидонис оформил сухарь и признан лучшим игроком.", img: "" },
                { date: "Сегодня", title: "Победа в дерби!", text: "Феникс вырывает невероятную победу на последних секундах матча.", img: "https://images.unsplash.com/photo-1580748141549-71748dbe0bdc?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" }
            ],
            matches: [
                { date: "10 Апр, 14:00", opponent: "Казань-Про", scoreF: "3", scoreO: "1", status: "Завершен", logoO: "" },
                { date: "20 Окт, 18:00", opponent: "Титан", scoreF: "4", scoreO: "2", status: "Завершен", logoO: "" },
                { date: "30 Окт, 20:00", opponent: "Метеор", scoreF: "-", scoreO: "-", status: "Ожидается", logoO: "" }
            ],
            shop: [
                { name: "Джерси Домашняя", price: "2 500 ₽", img: "👕" }, 
                { name: "Джерси Гостевая", price: "2 500 ₽", img: "🎽" }, 
                { name: "Шарф болельщика", price: "900 ₽", img: "🧣" },
                { name: "Рюкзак клубный", price: "3 500 ₽", img: "🎒" }
            ],
            players: [
                { name: "Петров", rating: 88, pos: "pos-c", posName: "ЦН", photo: "" },
                { name: "Сидоров", rating: 85, pos: "pos-lw", posName: "ЛН", photo: "" },
                { name: "Иванов", rating: 82, pos: "pos-rw", posName: "ПН", photo: "" },
                { name: "Смирнов", rating: 86, pos: "pos-ld", posName: "ЛЗ", photo: "" },
                { name: "Соколов", rating: 81, pos: "pos-rd", posName: "ПЗ", photo: "" },
                { name: "Давидонис", rating: 91, pos: "pos-gk", posName: "ВР", photo: "" }
            ],
            design: { color: "#ff5500", bg: "" }
        };

        // Загрузка
        let db = {
            news: JSON.parse(localStorage.getItem('phx_news_v7')) || defaults.news,
            matches: JSON.parse(localStorage.getItem('phx_matches_v7')) || defaults.matches,
            shop: JSON.parse(localStorage.getItem('phx_shop_v7')) || defaults.shop,
            players: JSON.parse(localStorage.getItem('phx_players_v7')) || defaults.players,
            design: JSON.parse(localStorage.getItem('phx_design_v7')) || defaults.design
        };

        function applyDesign() {
            document.documentElement.style.setProperty('--primary', db.design.color);
            let glowColor = db.design.color + '88'; 
            document.getElementById('glow1').style.background = glowColor;
            document.getElementById('glow2').style.background = glowColor;
            document.body.style.backgroundImage = db.design.bg ? `url('${db.design.bg}')` : 'none';
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function renderAll() {
            applyDesign();

            document.getElementById('newsContainer').innerHTML = db.news.map((n, i) => {
                if(i === db.news.length - 1 && n.img) {
                    return `<div class="glass-card featured-news" style="background-image: url('${n.img}'); border-color: var(--primary);">
                                <div class="featured-overlay">
                                    <div class="news-date">${n.date}</div>
                                    <div class="news-title">${n.title}</div>
                                    <div class="news-text">${n.text}</div>
                                </div>
                            </div>`;
                }
                return `<div class="glass-card">
                            <div class="news-date">${n.date}</div>
                            <div class="news-title">${n.title}</div>
                            <div class="news-text">${n.text}</div>
                        </div>`;
            }).reverse().join('');

            document.getElementById('calendarContainer').innerHTML = db.matches.map(m => {
                let lo = m.logoO ? `<img src="${m.logoO}" onerror="this.outerHTML='🛡️'">` : '🛡️';
                return `<div class="glass-card">
                            <div class="match-header">Турнир • ${m.date}</div>
                            <div class="match-row">
                                <div class="team-block"><div class="team-logo"><img src="1335.jpg" onerror="this.outerHTML='🦅'"></div><div class="team-name">Феникс</div></div>
                                <div class="score-block">
                                    <div class="match-time">${m.status}</div>
                                    <div class="score-pill">${m.scoreF} : ${m.scoreO}</div>
                                </div>
                                <div class="team-block"><div class="team-logo">${lo}</div><div class="team-name">${m.opponent}</div></div>
                            </div>
                        </div>`;
            }).reverse().join('');

            document.getElementById('shopContainer').innerHTML = db.shop.map(s => {
                let imgTag = s.img.startsWith('data:image') || s.img.startsWith('http') ? `<img src="${s.img}" class="shop-img" style="border-radius:16px;">` : `<div class="shop-img">${s.img}</div>`;
                return `<div class="glass-card shop-item">
                            ${imgTag}
                            <div class="shop-title">${s.name}</div>
                            <div class="shop-price">${s.price}</div>
                        </div>`;
            }).reverse().join('');

            let field = document.getElementById('fieldContainer');
            field.querySelectorAll('.player-card').forEach(c => c.remove());
            db.players.forEach(p => {
                let bg = p.photo ? `url('${p.photo}')` : `url('https://ui-avatars.com/api/?name=${p.name}&background=111&color=fff')`;
                let card = document.createElement('div');
                card.className = `player-card ${p.pos}`;
                card.innerHTML = `
                    <div class="card-rating">${p.rating}</div>
                    <div class="card-pos">${p.posName}</div>
                    <div class="card-photo" style="background-image: ${bg}"></div>
                    <div class="card-name">${p.name}</div>
                `;
                field.appendChild(card);
            });
        }

        // Админка
        function openAdmin() {
            let pass = prompt("Пароль (1234):");
            if(pass === "1234") {
                document.getElementById('gColor').value = db.design.color;
                document.getElementById('adminModal').classList.add('active');
            }
        }
        
        function closeAdmin() { document.getElementById('adminModal').classList.remove('active'); }
        
        function setAdminForm(formId, btn) {
            currentAdminForm = formId;
            document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
            document.getElementById(formId).classList.add('active');
        }

        // Функция обработки и сжатия картинки из файла
        function processFile(fileInputId, maxWidth, callback) {
            let file = document.getElementById(fileInputId).files[0];
            if (!file) { callback(""); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8)); // Сжимаем до Base64
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function finishSave() {
            localStorage.setItem('phx_news_v7', JSON.stringify(db.news));
            localStorage.setItem('phx_matches_v7', JSON.stringify(db.matches));
            localStorage.setItem('phx_shop_v7', JSON.stringify(db.shop));
            localStorage.setItem('phx_players_v7', JSON.stringify(db.players));
            localStorage.setItem('phx_design_v7', JSON.stringify(db.design));
            
            document.querySelectorAll('.admin-input[type="text"], .admin-input[type="number"], textarea').forEach(i => i.value = '');
            document.querySelectorAll('input[type="file"]').forEach(i => i.value = ''); // Очистка файлов
            renderAll();
            closeAdmin();
        }

        function saveData() {
            if (currentAdminForm === 'form-news') {
                let t = document.getElementById('nTitle').value, txt = document.getElementById('nText').value;
                if(t) {
                    processFile('nImgFile', 800, function(base64Img) {
                        db.news.push({ date: "Только что", title: t, text: txt, img: base64Img });
                        finishSave();
                    });
                }
            } 
            else if (currentAdminForm === 'form-match') {
                let o = document.getElementById('mOpponent').value, d = document.getElementById('mDate').value;
                let sf = document.getElementById('mScoreF').value, so = document.getElementById('mScoreO').value;
                let stat = sf ? "Завершен" : "Ожидается";
                if(o) {
                    processFile('mLogoOFile', 300, function(base64Img) {
                        db.matches.push({ date: d, opponent: o, scoreF: sf || "-", scoreO: so || "-", status: stat, logoO: base64Img });
                        finishSave();
                    });
                }
            }
            else if (currentAdminForm === 'form-player') {
                let n = document.getElementById('pName').value, r = document.getElementById('pRating').value, pos = document.getElementById('pPos').value;
                let posNames = {"pos-c":"ЦН", "pos-lw":"ЛН", "pos-rw":"ПН", "pos-ld":"ЛЗ", "pos-rd":"ПЗ", "pos-gk":"ВР"};
                if(n && r) {
                    processFile('pPhotoFile', 400, function(base64Img) {
                        let idx = db.players.findIndex(p => p.pos === pos);
                        let finalPhoto = base64Img;
                        if (idx > -1 && !base64Img) finalPhoto = db.players[idx].photo; // Сохраняем старое фото, если не выбрали новое
                        
                        let newPlayer = { name: n, rating: r, pos: pos, posName: posNames[pos], photo: finalPhoto };
                        if(idx > -1) db.players[idx] = newPlayer; else db.players.push(newPlayer);
                        finishSave();
                    });
                }
            }
            else if (currentAdminForm === 'form-shop') {
                let n = document.getElementById('sName').value, p = document.getElementById('sPrice').value, emoji = document.getElementById('sEmoji').value;
                if(n) {
                    processFile('sImgFile', 400, function(base64Img) {
                        db.shop.push({ name: n, price: p, img: base64Img || emoji || "📦" });
                        finishSave();
                    });
                }
            }
            else if (currentAdminForm === 'form-settings') {
                db.design.color = document.getElementById('gColor').value;
                processFile('gBgFile', 1080, function(base64Img) {
                    if (base64Img) db.design.bg = base64Img; // Если выбрали файл, ставим его
                    finishSave();
                });
            }
        }

        function clearBg() {
            db.design.bg = "";
            localStorage.setItem('phx_design_v7', JSON.stringify(db.design));
            applyDesign();
            alert("Фон успешно удален.");
        }

        function clearAllData() {
            if(confirm("Сбросить все данные и вернуть заводские настройки?")) {
                localStorage.clear();
                location.reload();
            }
        }

        renderAll();
    </script>
</body>
</html>
