<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПХК Феникс - Premium</title>
    <style>
        :root {
            --primary: #ff5500;
            --primary-glow: rgba(255, 85, 0, 0.6);
            --bg-dark: #050301;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Фоновые свечения */
        .ambient-glow {
            position: fixed; width: 300px; height: 300px; background: var(--primary);
            filter: blur(120px); border-radius: 50%; opacity: 0.3; z-index: -1; pointer-events: none;
        }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 20%; right: -150px; background: var(--primary); opacity: 0.2; }

        /* Шапка с центрированным логотипом */
        .header { 
            display: flex; justify-content: center; align-items: center; 
            padding: 15px 20px 10px; position: sticky; top: 0; z-index: 100;
            background: linear-gradient(180deg, rgba(5,3,1,0.95) 0%, rgba(5,3,1,0) 100%);
            height: 90px;
        }
        .logo-img-main { 
            height: 75px; width: auto; object-fit: contain; 
            filter: drop-shadow(0 0 15px var(--primary-glow)); 
        }
        .admin-avatar { 
            position: absolute; right: 20px; top: 25px;
            height: 38px; width: 38px; border-radius: 50%; 
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            font-size: 18px; cursor: pointer; color: var(--text-main);
        }

        /* Верхняя навигация */
        .top-nav { 
            display: flex; gap: 12px; overflow-x: auto; padding: 10px 20px 20px; 
            scrollbar-width: none; z-index: 99; position: relative;
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .tab-pill { 
            background: var(--glass-bg); color: var(--text-muted); 
            border: 1px solid var(--glass-border); padding: 10px 22px; 
            border-radius: 30px; font-size: 14px; font-weight: 600; 
            cursor: pointer; white-space: nowrap; transition: 0.3s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .tab-pill.active { 
            background: rgba(0,0,0,0.5); color: var(--text-main); 
            border-color: var(--primary); 
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05), 0 0 10px var(--primary-glow);
        }

        /* Экраны */
        .screen { display: none; padding: 0 20px 40px; animation: scaleIn 0.3s ease-out; }
        .screen.active { display: block; }
        @keyframes scaleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточки */
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            overflow: hidden; position: relative;
        }

        /* Новости */
        .featured-news { padding: 0; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; border: 1px solid var(--primary); }
        .featured-overlay { background: linear-gradient(0deg, #000 0%, transparent 100%); padding: 25px 20px; border-radius: 0 0 28px 28px; }
        .news-date { font-size: 11px; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .news-title { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
        .news-text { font-size: 14px; color: #ccc; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Календарь матчей */
        .match-header { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px; font-weight: 600; text-transform: uppercase; }
        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team-block { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .team-logo { width: 55px; height: 55px; background: rgba(0,0,0,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 24px; border: 1px solid var(--glass-border); overflow: hidden; }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
        .team-name { font-size: 13px; font-weight: 700; text-align: center; }
        
        .score-block { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .score-pill { 
            background: rgba(0,0,0,0.4); border: 1px solid var(--primary); border-radius: 20px; 
            padding: 8px 20px; font-size: 24px; font-weight: 900; 
            box-shadow: 0 0 15px var(--primary-glow); margin-bottom: 5px;
        }
        .match-time { font-size: 11px; color: var(--primary); font-weight: 700; }

        /* Магазин */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .shop-img { width: 70px; height: 70px; margin-bottom: 10px; object-fit: contain; font-size: 50px; line-height: 70px; }
        .shop-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #ddd; }
        .shop-price { font-size: 16px; font-weight: 800; color: var(--primary); }

        /* Поле */
        .field { 
            background: linear-gradient(180deg, #12141a 0%, #0a0b0e 100%);
            border: 2px solid var(--glass-border); border-radius: 28px; 
            height: 500px; position: relative; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8); margin-top: 10px;
        }
        .line-center { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.2); transform: translateY(-50%); }
        .circle-center { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal-area { position: absolute; left: 50%; width: 140px; height: 45px; border: 2px solid rgba(255,255,255,0.2); transform: translateX(-50%); }
        .goal-top { top: -2px; border-top: none; border-radius: 0 0 25px 25px; }
        .goal-bottom { bottom: -2px; border-bottom: none; border-radius: 25px 25px 0 0; }

        .player-card { 
            width: 70px; height: 105px; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--primary); border-radius: 12px; 
            position: absolute; transform: translate(-50%, -50%); 
            display: flex; flex-direction: column; align-items: center; padding: 6px 4px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card-rating { font-size: 18px; font-weight: 900; color: #fff; line-height: 1; }
        .card-pos { font-size: 9px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
        .card-photo { width: 42px; height: 42px; background: #222; border-radius: 50%; background-size: cover; background-position: center; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .card-name { font-size: 10px; font-weight: 600; color: #eee; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        .pos-c { top: 22%; left: 50%; } .pos-lw { top: 38%; left: 22%; } .pos-rw { top: 38%; left: 78%; }
        .pos-ld { top: 68%; left: 28%; } .pos-rd { top: 68%; left: 72%; } .pos-gk { top: 88%; left: 50%; }

        /* Админка */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px); }
        .modal-overlay.active { display: flex; animation: scaleIn 0.2s; }
        .modal-content { background: #111; width: 100%; max-width: 400px; border-radius: 28px; padding: 25px; border: 1px solid var(--glass-border); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: var(--glass-bg); border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        
        .admin-select, .admin-input { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #333; border-radius: 14px; margin-bottom: 12px; font-size: 14px; }
        .admin-select:focus, .admin-input:focus { border-color: var(--primary); outline: none; }
        .admin-btn-save { background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .admin-btn-danger { background: #aa0000; color: #fff; border: none; padding: 12px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 20px; }
        
        .form-group { display: none; }
        .form-group.active { display: block; }
    </style>
</head>
<body>

    <!-- Фоновые свечения (адаптируются под цвет) -->
    <div class="ambient-glow glow-1" id="glow1"></div>
    <div class="ambient-glow glow-2" id="glow2"></div>

    <!-- Шапка с Лого -->
    <header class="header">
        <img src="1335.jpg" alt="Logo" class="logo-img-main" onerror="this.src='https://ui-avatars.com/api/?name=PH&background=ff5500&color=fff'">
        <button class="admin-avatar" onclick="openAdmin()">⚙️</button>
    </header>

    <!-- Навигация -->
    <nav class="top-nav">
        <button class="tab-pill active" onclick="switchTab('news', this)">Главная</button>
        <button class="tab-pill" onclick="switchTab('calendar', this)">Календарь</button>
        <button class="tab-pill" onclick="switchTab('squad', this)">Состав</button>
        <button class="tab-pill" onclick="switchTab('shop', this)">Магазин</button>
    </nav>

    <div id="screen-news" class="screen active"><div id="newsContainer"></div></div>
    <div id="screen-calendar" class="screen"><div id="calendarContainer"></div></div>
    <div id="screen-squad" class="screen">
        <div class="field" id="fieldContainer">
            <div class="line-center"></div><div class="circle-center"></div>
            <div class="goal-area goal-top"></div><div class="goal-area goal-bottom"></div>
        </div>
    </div>
    <div id="screen-shop" class="screen"><div class="shop-grid" id="shopContainer"></div></div>

    <!-- Полная Админ-панель -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #fff; font-size: 18px;">Управление приложением</h3>
                <button class="close-btn" onclick="closeAdmin()">×</button>
            </div>
            
            <select class="admin-select" id="editorSelector" onchange="changeForm()">
                <option value="form-news">Новость (Главная)</option>
                <option value="form-match">Матч в календарь</option>
                <option value="form-player">Карточка игрока</option>
                <option value="form-shop">Товар в магазин</option>
                <option value="form-settings">🎨 Настройки дизайна</option>
            </select>

            <!-- Новость -->
            <div id="form-news" class="form-group active">
                <input type="text" id="nTitle" class="admin-input" placeholder="Заголовок">
                <textarea id="nText" class="admin-input" placeholder="Текст новости" rows="3"></textarea>
                <input type="text" id="nImg" class="admin-input" placeholder="URL картинки (для главной новости)">
            </div>

            <!-- Матч -->
            <div id="form-match" class="form-group">
                <input type="text" id="mOpponent" class="admin-input" placeholder="Название соперника (напр. Титан)">
                <input type="text" id="mDate" class="admin-input" placeholder="Дата (напр. 20 Окт, 18:00)">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="mScoreF" class="admin-input" placeholder="Голы (Мы)">
                    <input type="text" id="mScoreO" class="admin-input" placeholder="Голы (Они)">
                </div>
                <input type="text" id="mLogoF" class="admin-input" placeholder="URL логотипа Феникс (оставь пустым для стандарта)">
                <input type="text" id="mLogoO" class="admin-input" placeholder="URL логотипа соперника">
            </div>

            <!-- Игрок -->
            <div id="form-player" class="form-group">
                <input type="text" id="pName" class="admin-input" placeholder="Фамилия">
                <input type="number" id="pRating" class="admin-input" placeholder="Рейтинг (0-99)">
                <select id="pPos" class="admin-select">
                    <option value="pos-c">Центр (ЦН)</option>
                    <option value="pos-lw">Левый край (ЛН)</option>
                    <option value="pos-rw">Правый край (ПН)</option>
                    <option value="pos-ld">Левый защ. (ЛЗ)</option>
                    <option value="pos-rd">Правый защ. (ПЗ)</option>
                    <option value="pos-gk">Вратарь (ВР)</option>
                </select>
                <input type="text" id="pPhoto" class="admin-input" placeholder="URL фото игрока">
            </div>

            <!-- Магазин -->
            <div id="form-shop" class="form-group">
                <input type="text" id="sName" class="admin-input" placeholder="Название товара">
                <input type="text" id="sPrice" class="admin-input" placeholder="Цена (напр. 2500 ₽)">
                <input type="text" id="sEmoji" class="admin-input" placeholder="URL фото товара или Эмодзи">
            </div>

            <!-- Настройки дизайна -->
            <div id="form-settings" class="form-group">
                <label style="color:#aaa; font-size:12px; margin-bottom:5px; display:block;">Фирменный цвет (HEX):</label>
                <input type="color" id="gColor" class="admin-input" style="height: 50px; padding: 5px;">
                <label style="color:#aaa; font-size:12px; margin-bottom:5px; display:block;">Фоновая картинка приложения:</label>
                <input type="text" id="gBg" class="admin-input" placeholder="URL картинки (фон)">
                
                <button class="admin-btn-danger" onclick="clearAllData()">🗑️ Сбросить все данные</button>
            </div>

            <button class="admin-btn-save" id="saveBtn" onclick="saveData()">Сохранить изменения</button>
        </div>
    </div>

    <script>
        const defaults = {
            news: [
                { date: "Вчера", title: "Новая форма клуба", text: "Представлен дизайн на новый сезон.", img: "" },
                { date: "Сегодня", title: "Победа в дерби!", text: "Феникс вырывает победу на последних секундах матча.", img: "https://images.unsplash.com/photo-1580748141549-71748dbe0bdc?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" }
            ],
            matches: [
                { date: "20 Окт, 18:00", opponent: "Титан", scoreF: "4", scoreO: "2", status: "Завершен", logoF: "1335.jpg", logoO: "" },
                { date: "25 Окт, 19:30", opponent: "Легенда", scoreF: "-", scoreO: "-", status: "Ожидается", logoF: "1335.jpg", logoO: "" }
            ],
            shop: [
                { name: "Джерси Домашняя", price: "2 500 ₽", img: "👕" }, 
                { name: "Кепка Феникс", price: "1 200 ₽", img: "🧢" },
                { name: "Шарф болельщика", price: "900 ₽", img: "🧣" }
            ],
            players: [
                { name: "Петров", rating: 88, pos: "pos-c", posName: "ЦН", photo: "" },
                { name: "Сидоров", rating: 85, pos: "pos-lw", posName: "ЛН", photo: "" },
                { name: "Иванов", rating: 82, pos: "pos-rw", posName: "ПН", photo: "" },
                { name: "Смирнов", rating: 86, pos: "pos-ld", posName: "ЛЗ", photo: "" },
                { name: "Соколов", rating: 81, pos: "pos-rd", posName: "ПЗ", photo: "" },
                { name: "Давидонис", rating: 89, pos: "pos-gk", posName: "ВР", photo: "" }
            ],
            design: { color: "#ff5500", bg: "" }
        };

        let db = {
            news: JSON.parse(localStorage.getItem('phx_news_v5')) || defaults.news,
            matches: JSON.parse(localStorage.getItem('phx_matches_v5')) || defaults.matches,
            shop: JSON.parse(localStorage.getItem('phx_shop_v5')) || defaults.shop,
            players: JSON.parse(localStorage.getItem('phx_players_v5')) || defaults.players,
            design: JSON.parse(localStorage.getItem('phx_design_v5')) || defaults.design
        };

        function applyDesign() {
            document.documentElement.style.setProperty('--primary', db.design.color);
            let glowColor = db.design.color + '99'; // add transparency
            document.getElementById('glow1').style.background = glowColor;
            document.getElementById('glow2').style.background = glowColor;
            
            if(db.design.bg) {
                document.body.style.backgroundImage = `url('${db.design.bg}')`;
            } else {
                document.body.style.backgroundImage = 'none';
            }
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function renderAll() {
            applyDesign();

            // Новости
            document.getElementById('newsContainer').innerHTML = db.news.map((n, i) => {
                if(i === db.news.length - 1 && n.img) {
                    return `<div class="glass-card featured-news" style="background-image: url('${n.img}'); border-color: var(--primary);">
                                <div class="featured-overlay">
                                    <div class="news-date">${n.date}</div>
                                    <div class="news-title">${n.title}</div>
                                    <div class="news-text">${n.text}</div>
                                </div>
                            </div>`;
                }
                return `<div class="glass-card">
                            <div class="news-date">${n.date}</div>
                            <div class="news-title">${n.title}</div>
                            <div class="news-text">${n.text}</div>
                        </div>`;
            }).reverse().join('');

            // Календарь
            document.getElementById('calendarContainer').innerHTML = db.matches.map(m => {
                let lf = m.logoF ? `<img src="${m.logoF}">` : '🦅';
                let lo = m.logoO ? `<img src="${m.logoO}">` : '🛡️';
                return `<div class="glass-card">
                            <div class="match-header">Лига • ${m.date}</div>
                            <div class="match-row">
                                <div class="team-block"><div class="team-logo">${lf}</div><div class="team-name">Феникс</div></div>
                                <div class="score-block">
                                    <div class="match-time">${m.status}</div>
                                    <div class="score-pill">${m.scoreF} : ${m.scoreO}</div>
                                </div>
                                <div class="team-block"><div class="team-logo">${lo}</div><div class="team-name">${m.opponent}</div></div>
                            </div>
                        </div>`;
            }).reverse().join('');

            // Магазин
            document.getElementById('shopContainer').innerHTML = db.shop.map(s => {
                let imgTag = s.img.startsWith('http') ? `<img src="${s.img}" class="shop-img" style="border-radius:10px;">` : `<div class="shop-img">${s.img}</div>`;
                return `<div class="glass-card shop-item">
                            ${imgTag}
                            <div class="shop-title">${s.name}</div>
                            <div class="shop-price">${s.price}</div>
                        </div>`;
            }).reverse().join('');

            // Состав
            let field = document.getElementById('fieldContainer');
            field.querySelectorAll('.player-card').forEach(c => c.remove());
            db.players.forEach(p => {
                let bg = p.photo ? `url('${p.photo}')` : `url('https://ui-avatars.com/api/?name=${p.name}&background=111&color=fff')`;
                let card = document.createElement('div');
                card.className = `player-card ${p.pos}`;
                card.innerHTML = `
                    <div class="card-rating">${p.rating}</div>
                    <div class="card-pos">${p.posName}</div>
                    <div class="card-photo" style="background-image: ${bg}"></div>
                    <div class="card-name">${p.name}</div>
                `;
                field.appendChild(card);
            });
        }

        // Админка
        function openAdmin() {
            let pass = prompt("Пароль (1234):");
            if(pass === "1234") {
                document.getElementById('gColor').value = db.design.color;
                document.getElementById('gBg').value = db.design.bg;
                document.getElementById('adminModal').classList.add('active');
            }
        }
        function closeAdmin() { document.getElementById('adminModal').classList.remove('active'); }
        
        function changeForm() {
            document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
            let sel = document.getElementById('editorSelector').value;
            document.getElementById(sel).classList.add('active');
            document.getElementById('saveBtn').style.display = (sel === 'form-settings') ? 'block' : 'block';
        }

        function saveData() {
            let type = document.getElementById('editorSelector').value;

            if (type === 'form-news') {
                let t = document.getElementById('nTitle').value, txt = document.getElementById('nText').value, img = document.getElementById('nImg').value;
                if(t) db.news.push({ date: "Только что", title: t, text: txt, img: img });
            } 
            else if (type === 'form-match') {
                let o = document.getElementById('mOpponent').value, d = document.getElementById('mDate').value, sf = document.getElementById('mScoreF').value, so = document.getElementById('mScoreO').value;
                let lf = document.getElementById('mLogoF').value || "1335.jpg";
                let lo = document.getElementById('mLogoO').value;
                let stat = sf ? "Завершен" : "Ожидается";
                if(o) db.matches.push({ date: d, opponent: o, scoreF: sf || "-", scoreO: so || "-", status: stat, logoF: lf, logoO: lo });
            }
            else if (type === 'form-player') {
                let n = document.getElementById('pName').value, r = document.getElementById('pRating').value, pos = document.getElementById('pPos').value, ph = document.getElementById('pPhoto').value;
                let posNames = {"pos-c":"ЦН", "pos-lw":"ЛН", "pos-rw":"ПН", "pos-ld":"ЛЗ", "pos-rd":"ПЗ", "pos-gk":"ВР"};
                if(n && r) {
                    let idx = db.players.findIndex(p => p.pos === pos);
                    let newPlayer = { name: n, rating: r, pos: pos, posName: posNames[pos], photo: ph };
                    if(idx > -1) db.players[idx] = newPlayer; else db.players.push(newPlayer);
                }
            }
            else if (type === 'form-shop') {
                let n = document.getElementById('sName').value, p = document.getElementById('sPrice').value, e = document.getElementById('sEmoji').value || "📦";
                if(n) db.shop.push({ name: n, price: p, img: e });
            }
            else if (type === 'form-settings') {
                db.design.color = document.getElementById('gColor').value;
                db.design.bg = document.getElementById('gBg').value;
            }

            localStorage.setItem('phx_news_v5', JSON.stringify(db.news));
            localStorage.setItem('phx_matches_v5', JSON.stringify(db.matches));
            localStorage.setItem('phx_shop_v5', JSON.stringify(db.shop));
            localStorage.setItem('phx_players_v5', JSON.stringify(db.players));
            localStorage.setItem('phx_design_v5', JSON.stringify(db.design));
            
            document.querySelectorAll('.admin-input[type="text"], .admin-input[type="number"], textarea').forEach(i => i.value = '');
            renderAll();
            closeAdmin();
        }

        function clearAllData() {
            if(confirm("ВНИМАНИЕ! Это удалит все добавленные новости, матчи и вернет стандартный состав. Продолжить?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Старт
        renderAll();
    </script>
</body>
</html>
