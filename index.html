<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФК Феникс - Мой состав</title>
    <style>
        /* Темная тема и базовые стили */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Темный фон */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px; /* Отступ для нижнего меню */
        }

        /* Верхняя панель */
        .header {
            background-color: #1e1e1e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6600; /* Фирменный оранжевый */
        }
        
        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff6600;
            margin: 0;
        }

        /* Контейнер флорбольного поля */
        .field-container {
            padding: 20px;
        }

        .field {
            background-color: #dcb37b; /* Цвет паркета/покрытия */
            border: 3px solid #ffffff;
            border-radius: 8px;
            height: 400px;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            overflow: hidden;
        }

        /* Разметка площадки (центральная линия и круг) */
        .field::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #ffffff;
            transform: translateY(-50%);
        }
        
        .field::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Зоны ворот */
        .goal-area-top, .goal-area-bottom {
            position: absolute;
            left: 50%;
            width: 120px;
            height: 40px;
            border: 2px solid #ffffff;
            transform: translateX(-50%);
        }
        .goal-area-top { top: 0; border-top: none; border-radius: 0 0 20px 20px; }
        .goal-area-bottom { bottom: 0; border-bottom: none; border-radius: 20px 20px 0 0; }

        /* Карточка игрока на поле */
        .player-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 2px solid #ff6600;
            border-radius: 8px;
            width: 60px;
            padding: 5px;
            text-align: center;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .player-rating {
            font-size: 14px;
            font-weight: bold;
            color: #ff6600;
        }

        .player-name {
            font-size: 10px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Расстановка карточек (пример 2-2-1) */
        .pos-gk { top: 90%; left: 50%; }
        .pos-ld { top: 70%; left: 25%; }
        .pos-rd { top: 70%; left: 75%; }
        .pos-lw { top: 35%; left: 25%; }
        .pos-rw { top: 35%; left: 75%; }
        .pos-c { top: 20%; left: 50%; }

        /* Нижнее навигационное меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #1e1e1e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
        }

        .nav-item {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active {
            color: #ff6600;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="header-title">ПХК ФЕНИКС</h1>
        <div class="admin-icon" style="color: #ff6600; font-size: 24px;">⚙️</div>
    </div>

    <div class="field-container">
        <div style="margin-bottom: 15px;">
            <h2 style="margin: 0; font-size: 18px;">Fan Lineup Builder</h2>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #aaa;">Собери свой состав на игру. Рейтинги формируются фанатами.</p>
        </div>

        <div class="field">
            <div class="goal-area-top"></div>
            <div class="goal-area-bottom"></div>

            <!-- Пример карточек расставленных на поле -->
            <div class="player-card pos-c">
                <div class="player-rating">88</div>
                <div class="player-name">Петров</div>
            </div>
            
            <div class="player-card pos-lw">
                <div class="player-rating">85</div>
                <div class="player-name">Сидоров</div>
            </div>
            
            <div class="player-card pos-rw">
                <div class="player-rating">82</div>
                <div class="player-name">Иванов</div>
            </div>

            <div class="player-card pos-ld">
                <div class="player-rating">86</div>
                <div class="player-name">Смирнов</div>
            </div>

            <div class="player-card pos-rd">
                <div class="player-rating">81</div>
                <div class="player-name">Соколов</div>
            </div>

            <div class="player-card pos-gk">
                <div class="player-rating">89</div>
                <div class="player-name">Вратарь</div>
            </div>
        </div>
    </div>

    <!-- Навигация -->
    <div class="bottom-nav">
        <a href="#" class="nav-item">
            <span class="nav-icon">🏠</span>
            Главная
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📅</span>
            Календарь
        </a>
        <a href="#" class="nav-item active">
            <span class="nav-icon">👕</span>
            Состав
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📰</span>
            Новости
        </a>
    </div>

</body>
</html>
