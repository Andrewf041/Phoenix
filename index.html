<DTCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПХК Феникс</title>
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-card: #1a1d24;
            --accent: #ff6600;
            --text-main: #ffffff;
            --text-muted: #8a8d98;
            --field-bg: #cda375;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--bg-card); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .header-logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 40px; width: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .header-title { font-size: 18px; font-weight: 800; text-transform: uppercase; color: var(--accent); }
        .admin-toggle { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--accent); }
        
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
        .section-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

        /* Поле */
        .field { background: var(--field-bg); border: 4px solid #fff; border-radius: 12px; height: 480px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden; }
        .line-center { position: absolute; top: 50%; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.8); transform: translateY(-50%); }
        .circle-center { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; border: 3px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal-area { position: absolute; left: 50%; width: 140px; height: 45px; border: 3px solid rgba(255,255,255,0.8); transform: translateX(-50%); }
        .goal-top { top: 0; border-top: none; border-radius: 0 0 25px 25px; }
        .goal-bottom { bottom: 0; border-bottom: none; border-radius: 25px 25px 0 0; }

        /* Карточки */
        .player-card { width: 75px; height: 110px; background: linear-gradient(135deg, #2a2d35 0%, #16181d 100%); border: 2px solid var(--accent); border-radius: 8px 8px 25px 25px; position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; padding: 4px; box-shadow: 0 8px 15px rgba(0,0,0,0.5); }
        .card-rating { font-size: 20px; font-weight: 900; color: #fff; }
        .card-pos { font-size: 10px; font-weight: 700; color: var(--accent); }
        .card-photo { width: 45px; height: 45px; background: #444; border-radius: 50%; margin: 4px 0; background-size: cover; background-position: center; }
        .card-name { font-size: 11px; font-weight: 600; color: #ddd; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        .pos-c { top: 22%; left: 50%; }
        .pos-lw { top: 38%; left: 22%; }
        .pos-rw { top: 38%; left: 78%; }
        .pos-ld { top: 68%; left: 28%; }
        .pos-rd { top: 68%; left: 72%; }
        .pos-gk { top: 88%; left: 50%; }

        /* Карточка контента */
        .content-card { background: var(--bg-card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        
        /* Админ-панель */
        .admin-panel { background: #16181d; border: 2px dashed var(--accent); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .admin-panel.open { display: block; }
        .admin-input { width: 100%; padding: 8px; margin-bottom: 10px; background: #0d0f12; border: 1px solid #333; color: #fff; border-radius: 6px; }
        .admin-btn { background: var(--accent); color: #fff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1a1d24; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-logo-container">
            <img src="1094.jpg" alt="Logo" class="logo-img" onerror="this.src='https://ui-avatars.com/api/?name=PH&background=ff6600&color=fff'">
            <h1 class="header-title">Феникс</h1>
        </div>
        <button class="admin-toggle" onclick="toggleAdmin()">⚙️</button>
    </header>

    <!-- Главная -->
    <div id="screen-home" class="screen">
        <h2 class="section-title">Главная</h2>
        <p class="section-subtitle">Сводка клуба</p>
        <div class="content-card">
            <h3>Последний матч</h3>
            <p style="color: #aaa; margin-top: 5px;">Феникс 6 : 2 Легенда</p>
        </div>
    </div>

    <!-- Календарь -->
    <div id="screen-calendar" class="screen">
        <h2 class="section-title">Календарь игр</h2>
        <p class="section-subtitle">Расписание матчей</p>
        <div class="content-card">
            <h3>Следующая игра</h3>
            <p style="color: var(--accent); margin-top: 5px;">Феникс vs Титан • 20 октября</p>
        </div>
    </div>

    <!-- Состав -->
    <div id="screen-squad" class="screen active">
        <h2 class="section-title">Fan Lineup</h2>
        <p class="section-subtitle">Состав по оценкам болельщиков</p>

        <!-- Скрытая панель разработчика для добавления фото/игроков -->
        <div id="adminPanel" class="admin-panel">
            <h3 style="color: var(--accent); margin-bottom: 10px; font-size: 16px;">Режим разработчика</h3>
            <input type="text" id="pName" class="admin-input" placeholder="Имя игрока (например, Петров)">
            <input type="number" id="pRating" class="admin-input" placeholder="Рейтинг (например, 88)">
            <select id="pPos" class="admin-input">
                <option value="pos-c">Центр (ЦН)</option>
                <option value="pos-lw">Левый нападающий (ЛН)</option>
                <option value="pos-rw">Правый нападающий (ПН)</option>
                <option value="pos-ld">Левый защитник (ЛЗ)</option>
                <option value="pos-rd">Правый защитник (ПЗ)</option>
                <option value="pos-gk">Вратарь (ВР)</option>
            </select>
            <input type="text" id="pPhoto" class="admin-input" placeholder="Ссылка на фото (URL)">
            <button class="admin-btn" onclick="savePlayer()">Сохранить игрока</button>
        </div>

        <div class="field" id="hockeyField">
            <div class="line-center"></div>
            <div class="circle-center"></div>
            <div class="goal-area goal-top"></div>
            <div class="goal-area goal-bottom"></div>
            <!-- Карточки рендерятся через JavaScript -->
        </div>
    </div>

    <!-- Новости -->
    <div id="screen-news" class="screen">
        <h2 class="section-title">Новости</h2>
        <p class="section-subtitle">События команды</p>
        
        <div id="newsContainer">
            <!-- Новости будут здесь -->
        </div>
    </div>

    <!-- Нижнее меню -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="switchTab('home', this)"><span style="font-size:20px">🏠</span>Главная</button>
        <button class="nav-item" onclick="switchTab('calendar', this)"><span style="font-size:20px">📅</span>Календарь</button>
        <button class="nav-item active" onclick="switchTab('squad', this)"><span style="font-size:20px">👕</span>Состав</button>
        <button class="nav-item" onclick="switchTab('news', this)"><span style="font-size:20px">📰</span>Новости</button>
    </nav>

    <script>
        // Переключение экранов
        function switchTab(tabId, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        // Админ-панель
        function toggleAdmin() {
            let pass = prompt("Введите пароль разработчика:");
            if (pass === "1234") {
                document.getElementById('adminPanel').classList.toggle('open');
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        // Данные игроков по умолчанию
        let defaultPlayers = [
            { name: "Петров", rating: 88, pos: "pos-c", positionCode: "ЦН", photo: "" },
            { name: "Сидоров", rating: 85, pos: "pos-lw", positionCode: "ЛН", photo: "" },
            { name: "Иванов", rating: 82, pos: "pos-rw", positionCode: "ПН", photo: "" },
            { name: "Смирнов", rating: 86, pos: "pos-ld", positionCode: "ЛЗ", photo: "" },
            { name: "Соколов", rating: 81, pos: "pos-rd", positionCode: "ПЗ", photo: "" },
            { name: "Давидонис", rating: 89, pos: "pos-gk", positionCode: "ВР", photo: "" }
        ];

        let defaultNews = [
            { title: "Новая форма клуба", text: "Представлены комплекты домашней и выездной формы на сезон." },
            { title: "Старт турнира", text: "Команда отправилась на выездной тур в Казань." }
        ];

        // Загрузка из памяти телефона
        let players = JSON.parse(localStorage.getItem('phoenix_players')) || defaultPlayers;
        let news = JSON.parse(localStorage.getItem('phoenix_news')) || defaultNews;

        function renderField() {
            let field = document.getElementById('hockeyField');
            // Оставляем разметку поля, удаляем старые карточки
            let cards = field.querySelectorAll('.player-card');
            cards.forEach(c => c.remove());

            players.forEach(p => {
                let card = document.createElement('div');
                card.className = `player-card ${p.pos}`;
                let photoStyle = p.photo ? `background-image: url('${p.photo}')` : `background-image: url('https://ui-avatars.com/api/?name=${p.name}&background=ff6600&color=fff')`;
                card.innerHTML = `
                    <div class="card-rating">${p.rating}</div>
                    <div class="card-pos">${p.positionCode || 'ИГР'}</div>
                    <div class="card-photo" style="${photoStyle}"></div>
                    <div class="card-name">${p.name}</div>
                `;
                field.appendChild(card);
            });
        }

        function renderNews() {
            let container = document.getElementById('newsContainer');
            container.innerHTML = news.map(n => `
                <div class="content-card">
                    <h3>${n.title}</h3>
                    <p style="color: #aaa; font-size: 13px; margin-top: 5px;">${n.text}</p>
                </div>
            `).join('');
        }

        function savePlayer() {
            let name = document.getElementById('pName').value;
            let rating = document.getElementById('pRating').value;
            let pos = document.getElementById('pPos').value;
            let photo = document.getElementById('pPhoto').value;

            if(!name || !rating) {
                alert("Заполните имя и рейтинг!");
                return;
            }

            let posCode = "ИГР";
            if(pos === 'pos-c') posCode = "ЦН";
            if(pos === 'pos-lw') posCode = "ЛН";
            if(pos === 'pos-rw') posCode = "ПН";
            if(pos === 'pos-ld') posCode = "ЛЗ";
            if(pos === 'pos-rd') posCode = "ПЗ";
            if(pos === 'pos-gk') posCode = "ВР";

            // Ищем, нет ли уже игрока на этой позиции, чтобы заменить
            let existingIndex = players.findIndex(p => p.pos === pos);
            if(existingIndex !== -1) {
                players[existingIndex] = { name, rating, pos, positionCode: posCode, photo };
            } else {
                players.push({ name, rating, pos, positionCode: posCode, photo });
            }

            localStorage.setItem('phoenix_players', JSON.stringify(players));
            renderField();
            alert("Игрок успешно сохранен на поле!");
        }

        // Инициализация при загрузке
        renderField();
        renderNews();
    </script>
</body>
</html>
