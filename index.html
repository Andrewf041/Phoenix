<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПХК Феникс - Live</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#ff5500">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* ==========================================================================
           ROOT VARIABLES & THEMES
           ========================================================================== */
        :root { 
            --primary: #ff5500; 
            --primary-glow: rgba(255, 85, 0, 0.4); 
            --primary-grad: linear-gradient(135deg, #ff5500, #cc4400);
            --bg-dark: #0a0b10; 
            --glass-bg: rgba(255, 255, 255, 0.04); 
            --glass-border: rgba(255, 255, 255, 0.08); 
            --text-main: #ffffff; 
            --text-muted: #a0a5aa; 
            --card-shadow: 0 10px 30px rgba(0,0,0,0.3);
            --transition-speed: 0.3s;
        }

        /* LIGHT THEME VARIABLES */
        body[data-theme="light"] {
            --bg-dark: #f0f2f5; 
            --glass-bg: rgba(255, 255, 255, 0.7); 
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #111111; 
            --text-muted: #555555; 
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body[data-theme="light"] .player-card { background: rgba(255,255,255,0.9); }
        body[data-theme="light"] .card-name, 
        body[data-theme="light"] .card-rating { color: #111; text-shadow: none; }
        body[data-theme="light"] .admin-input { background: rgba(255,255,255,0.9); color: #111; }
        body[data-theme="light"] .stats-tbl td, 
        body[data-theme="light"] .msg-text, 
        body[data-theme="light"] .news-text { color: #222; }

        /* ==========================================================================
           BASE STYLES & RESET
           ========================================================================== */
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh; 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            overflow-x: hidden; 
            scroll-behavior: smooth; 
            transition: background-color var(--transition-speed), color var(--transition-speed); 
        }

        /* ==========================================================================
           ANIMATIONS & UTILITIES
           ========================================================================== */
        .skeleton { 
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); 
            background-size: 200% 100%; 
            animation: skeleton-loading 1.5s infinite; 
            border-radius: 14px; 
            min-height: 100px; 
            margin-bottom: 15px; 
        }
        
        @keyframes skeleton-loading { 
            0% { background-position: 200% 0; } 
            100% { background-position: -200% 0; } 
        }

        @keyframes scaleIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 64, 0.7); } 
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 64, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 64, 0); } 
        }

        .ambient-glow { 
            position: fixed; 
            width: 400px; 
            height: 400px; 
            background: var(--primary); 
            filter: blur(150px); 
            border-radius: 50%; 
            opacity: 0.15; 
            z-index: -1; 
            pointer-events: none; 
            transition: background 0.5s; 
        }
        
        .glow-1 { top: -100px; left: -100px; } 
        .glow-2 { bottom: 10%; right: -150px; opacity: 0.1; }

        /* ==========================================================================
           NAVIGATION & HEADER
           ========================================================================== */
        .top-bar { 
            position: relative; 
            z-index: 1000; 
            width: 100%; 
            padding-top: 15px; 
        }

        .header { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 10px 20px 5px; 
            position: relative; 
        }

        .logo-img-main { 
            height: 85px; 
            width: 85px; 
            border-radius: 50%; 
            object-fit: cover; 
            filter: drop-shadow(0 4px 12px var(--primary-glow)); 
            user-select: none; 
            transition: transform var(--transition-speed) ease; 
        }

        .logo-img-main:hover { 
            transform: scale(1.05); 
        }
        
        .menu-burger, .notif-bell, .cart-btn, .user-btn { 
            position: absolute; 
            top: 32px; 
            width: 44px; 
            height: 44px; 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 101; 
            backdrop-filter: blur(10px); 
            transition: all 0.2s; 
        }
        
        .menu-burger { right: 20px; flex-direction: column; gap: 5px; }
        .notif-bell { left: 20px; font-size: 20px; }
        .cart-btn { right: 75px; font-size: 20px; }
        .user-btn { left: 75px; font-size: 20px; }
        
        .menu-burger:active, .notif-bell:active, .cart-btn:active, .user-btn:active { 
            transform: scale(0.9); 
            background: rgba(255,255,255,0.1); 
        }
        
        .menu-burger span { 
            width: 20px; 
            height: 2px; 
            background: var(--text-main); 
            border-radius: 2px; 
            pointer-events: none; 
        }

        .badge-counter { 
            position: absolute; 
            top: -2px; 
            right: -2px; 
            background: #ff0040; 
            color: #fff; 
            font-size: 11px; 
            font-weight: 900; 
            min-width: 20px; 
            height: 20px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid var(--bg-dark); 
        }
        
        .notif-badge { animation: pulse 2s infinite; }

        .top-nav { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 15px 20px 25px; 
            scrollbar-width: none; 
            z-index: 99; 
            position: relative; 
        }
        
        .top-nav::-webkit-scrollbar { display: none; }
        
        .tab-pill { 
            background: var(--glass-bg); 
            color: var(--text-muted); 
            border: 1px solid var(--glass-border); 
            padding: 12px 22px; 
            border-radius: 20px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            white-space: nowrap; 
            transition: all var(--transition-speed); 
            backdrop-filter: blur(10px); 
        }
        
        .tab-pill.active { 
            background: var(--primary-grad); 
            color: #fff; 
            border-color: transparent; 
            box-shadow: 0 6px 15px var(--primary-glow); 
            transform: translateY(-2px); 
        }

        .screen { 
            display: none; 
            padding: 0 20px 40px; 
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        .screen.active { display: block; }

        /* ==========================================================================
           UI COMPONENTS (CARDS, BUTTONS, INPUTS)
           ========================================================================== */
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            padding: 24px; 
            margin-bottom: 24px; 
            box-shadow: var(--card-shadow); 
            position: relative; 
            overflow: hidden; 
            transition: transform var(--transition-speed); 
        }

        .btn-action {
            background: rgba(255,255,255,0.1); 
            border: 1px solid var(--glass-border); 
            color: var(--text-main); 
            padding: 8px 12px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 5px; 
            margin-top: 15px; 
            width: fit-content; 
            transition: 0.2s;
        }

        .btn-action:hover {
            background: var(--primary-grad); 
            border-color: transparent;
            color: #fff;
        }

        .admin-input { 
            width: 100%; 
            padding: 16px; 
            background: rgba(0,0,0,0.5); 
            color: var(--text-main); 
            border: 1px solid var(--glass-border); 
            border-radius: 16px; 
            margin-bottom: 12px; 
            font-size: 14px; 
            transition: 0.3s; 
            outline: none; 
        }

        .admin-input:focus { border-color: var(--primary); }
        
        .admin-btn-save { 
            background: var(--primary-grad); 
            color: #fff; 
            border: none; 
            padding: 18px; 
            border-radius: 16px; 
            font-weight: 800; 
            width: 100%; 
            cursor: pointer; 
            text-align: center; 
            display: block; 
            font-size: 15px; 
            box-shadow: 0 6px 20px var(--primary-glow); 
            transition: transform 0.2s; 
        }
        
        .admin-btn-save:active { transform: scale(0.97); }

        .delete-btn { 
            display: none; 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            background: rgba(255,68,68,0.9); 
            border: none; 
            color: #fff; 
            width: 28px; 
            height: 28px; 
            border-radius: 8px; 
            cursor: pointer; 
            z-index: 100; 
            font-size: 12px; 
            align-items: center; 
            justify-content: center; 
        }
        
        .is-admin .delete-btn { display: flex; }

        /* ==========================================================================
           NEWS & POLLS
           ========================================================================== */
        .news-actions { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
            border-top: 1px solid rgba(128,128,128,0.2); 
            padding-top: 15px; 
        }
        
        .news-comments-section { 
            margin-top: 15px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 18px; 
            padding: 15px; 
        }
        
        .news-comment { 
            background: rgba(255,255,255,0.03); 
            padding: 10px 14px; 
            border-radius: 14px; 
            font-size: 14px; 
            position: relative; 
            border-left: 2px solid var(--primary); 
            margin-bottom:10px; 
            color:var(--text-main); 
        }
        
        .nc-name { 
            font-size: 11px; 
            color: var(--primary); 
            font-weight: 800; 
            margin-bottom: 4px; 
        }

        .poll-container { 
            margin-top: 15px; 
            background: rgba(0,0,0,0.3); 
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid var(--glass-border); 
        }
        
        .poll-option { 
            background: rgba(255,255,255,0.05); 
            padding: 10px 15px; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            position: relative; 
            overflow: hidden; 
        }
        
        .poll-option:hover { background: rgba(255,255,255,0.1); }
        
        .poll-fill { 
            position: absolute; 
            left: 0; 
            top: 0; 
            bottom: 0; 
            background: var(--primary-glow); 
            z-index: 0; 
            width: 0%; 
            transition: width 0.5s ease; 
        }
        
        .poll-text { 
            position: relative; 
            z-index: 1; 
            font-weight: 600; 
            font-size: 14px; 
            color:var(--text-main); 
        }

        /* ==========================================================================
           FIELD & PLAYER CARDS (ULTIMATE TEAM STYLE)
           ========================================================================== */
        .field { 
            background: linear-gradient(180deg, #11141a 0%, #08090d 100%); 
            border: 2px solid var(--glass-border); 
            border-radius: 28px; 
            height: 520px; 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9); 
            margin-top: 10px;
        }
        
        .line-center { 
            position: absolute; top: 50%; left: 0; right: 0; 
            height: 2px; background: rgba(255,255,255,0.1); transform: translateY(-50%); 
        }
        
        .circle-center { 
            position: absolute; top: 50%; left: 50%; 
            width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.1); 
            border-radius: 50%; transform: translate(-50%, -50%); 
        }
        
        .goal-area { 
            position: absolute; left: 50%; width: 140px; height: 45px; 
            border: 2px solid rgba(255,255,255,0.1); transform: translateX(-50%); 
        }
        
        .goal-top { top: -2px; border-top: none; border-radius: 0 0 25px 25px; } 
        .goal-bottom { bottom: -2px; border-bottom: none; border-radius: 25px 25px 0 0; }
        
        .player-card { 
            width: 76px; 
            height: 116px; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(8px); 
            border: 1px solid var(--glass-border); 
            border-radius: 14px; 
            position: absolute; 
            transform: translate(-50%, -50%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 8px 4px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); 
            transition: all 0.2s; 
            cursor: pointer; 
            overflow: hidden; 
        }
        
        .player-card:hover { z-index: 10; transform: translate(-50%, -50%) scale(1.1); }
        .player-card.bench { position: relative; transform: none; flex-shrink: 0; left: 0; top: 0; margin-top: 5px; }
        .player-card.bench:hover { transform: scale(1.1); }
        
        /* GOLD CARD EFFECT */
        .card-gold { 
            border: 2px solid #ffd700; 
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(0,0,0,0.8)); 
            box-shadow: 0 0 20px rgba(255,215,0,0.4); 
        }
        
        .card-gold::after { 
            content: ''; 
            position: absolute; 
            top: -50%; left: -50%; width: 200%; height: 200%; 
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%); 
            transform: rotate(45deg); 
            animation: shine 3s infinite; 
            pointer-events: none; 
        }
        
        @keyframes shine { 
            0% { left: -100%; top: -100%; } 
            20% { left: 100%; top: 100%; } 
            100% { left: 100%; top: 100%; } 
        }

        .card-photo { 
            width: 46px; 
            height: 46px; 
            background: #222; 
            border-radius: 50%; 
            background-size: cover; 
            background-position: center; 
            margin-bottom: 6px; 
            border: 2px solid rgba(255,255,255,0.1); 
        }
        
        .card-rating { 
            font-size: 20px; 
            font-weight: 900; 
            color: #fff; 
            line-height: 1; 
            text-shadow: 0 2px 10px var(--primary-glow); 
        }
        
        .card-pos { font-size: 10px; font-weight: 800; color: var(--primary); margin-bottom: 6px; margin-top: 2px; }
        .card-name { font-size: 11px; font-weight: 700; color: var(--text-main); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        
        /* Player Positioning */
        .pos-c { top: 22%; left: 50%; } 
        .pos-lw { top: 38%; left: 22%; } 
        .pos-rw { top: 38%; left: 78%; } 
        .pos-ld { top: 68%; left: 28%; } 
        .pos-rd { top: 68%; left: 72%; } 
        .pos-gk { top: 88%; left: 50%; }

        /* ==========================================================================
           MODALS (PROFILE, AUTH, CART)
           ========================================================================== */
        .social-dropdown { 
            display: none; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.85); 
            z-index: 2000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(15px); 
            padding: 20px; 
        }
        
        .social-dropdown.active { display: flex; animation: scaleIn 0.2s; }

        .modal-box {
            background: var(--bg-dark); 
            border: 1px solid var(--glass-border); 
            border-radius: 28px; 
            width: 100%; 
            max-width: 360px; 
            padding: 30px; 
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            position: relative;
        }

        .profile-photo-large { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            margin: 0 auto 15px; 
            background-size: cover; 
            background-position: center; 
            border: 3px solid var(--primary); 
            box-shadow: 0 0 20px var(--primary-glow); 
        }
        
        .profile-name { font-size: 22px; font-weight: 900; color: var(--text-main); margin-bottom: 5px; }
        .profile-pos { font-size: 14px; color: var(--primary); font-weight: 800; margin-bottom: 20px; }
        
        .profile-stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        
        .p-stat-box { 
            background: var(--glass-bg); 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
        }
        
        .p-stat-val { font-size: 18px; font-weight: 900; color: var(--text-main); }
        .p-stat-lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        /* Canvas Radar Chart */
        #radarChart {
            width: 100%;
            height: 200px;
            margin-bottom: 15px;
        }

        /* Cart Item Styles */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
        }

        .cart-item img {
            width: 40px; height: 40px; border-radius: 8px; object-fit: cover;
        }

        /* ==========================================================================
           LIVE & MATCHDAY COMPONENTS
           ========================================================================== */
        .live-board { 
            background: linear-gradient(145deg, rgba(255,85,0,0.15), rgba(0,0,0,0.8)); 
            border: 1px solid var(--primary); 
            border-radius: 28px; 
            padding: 30px 20px; 
            text-align: center; 
            margin-bottom: 24px; 
        }
        
        .live-badge { 
            display: inline-block; 
            background: #ff0040; color: #fff; 
            font-size: 12px; font-weight: 900; 
            padding: 6px 16px; border-radius: 20px; 
            text-transform: uppercase; margin-bottom: 15px; 
            animation: pulse 1.5s infinite; 
        }
        
        .live-teams { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; color:var(--text-main); }
        .live-score-big { font-size: 56px; font-weight: 900; text-shadow: 0 0 40px var(--primary-glow); color: var(--text-main); }

        .checkin-panel { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .checkin-btn { 
            flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); 
            padding: 12px; border-radius: 16px; color: var(--text-main); 
            font-weight: 700; cursor: pointer; transition: 0.2s; 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
        }
        .checkin-btn.active { background: var(--primary-grad); border-color: transparent; }
        .checkin-count { font-size: 20px; font-weight: 900; }

        /* ==========================================================================
           SHOP & GALLERY
           ========================================================================== */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { 
            padding: 18px; text-align: center; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
        }
        .shop-img { 
            width: 90px; height: 90px; margin-bottom: 15px; 
            object-fit: contain; font-size: 60px; line-height: 90px; border-radius: 18px; 
        }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .gallery-thumb { aspect-ratio: 1; border-radius: 14px; object-fit: cover; width: 100%; border: 1px solid var(--glass-border); }

        /* Confetti */
        .confetti { 
            position: fixed; top: -10px; width: 10px; height: 10px; 
            z-index: 9999; animation: fall linear forwards; 
            pointer-events: none; border-radius: 2px; 
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        /* Chat Styles */
        .chat-section { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px; backdrop-filter: blur(15px); margin-top: 15px; }
        .chat-messages { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; padding-right: 5px; }
        .msg { display: flex; gap: 12px; align-items: flex-end; position: relative; }
        .msg-content { background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 16px 16px 16px 4px; border: 1px solid var(--glass-border); max-width: 85%; }
        
        .admin-controls { display: none; margin-top: 35px; border-top: 1px dashed rgba(128,128,128,0.3); padding-top: 25px; }
        .is-admin .admin-controls { display: block; animation: scaleIn 0.3s; }
    </style>
</head>
<body>

    <!-- ==========================================================================
         TOP BAR & NAVIGATION
         ========================================================================== -->
    <div class="top-bar">
        <div class="user-btn" onclick="openAuthModal()">👤</div>
        <div class="notif-bell" onclick="openNotifications()">🔔<span class="badge-counter notif-badge" id="notifBadge" style="display:none;">0</span></div>
        <div class="cart-btn" onclick="openCartModal()">🛒<span class="badge-counter" id="cartBadge" style="display:none;">0</span></div>
        <div class="menu-burger" onclick="toggleSocialMenu()"><span></span><span></span><span></span></div>
        
        <header class="header">
            <img id="mainLogoElement" src="1335.jpg" alt="ФЕНИКС" class="logo-img-main" onerror="this.src='https://ui-avatars.com/api/?name=PH&background=ff5500&color=fff'">
        </header>

        <nav class="top-nav" id="mainNav">
            <button type="button" class="tab-pill active" onclick="switchTab('news', this)">Главная</button>
            <button type="button" class="tab-pill" onclick="switchTab('squad', this)">Состав</button>
            <button type="button" class="tab-pill" onclick="switchTab('calendar', this)">Календарь</button>
            <button type="button" class="tab-pill" onclick="switchTab('schedule', this)">📋 График</button>
            <button type="button" class="tab-pill" onclick="switchTab('live', this)">🔴 Live</button>
            <button type="button" class="tab-pill" onclick="switchTab('stats', this)">📊 Стат</button>
            <button type="button" class="tab-pill" onclick="switchTab('predictions', this)">🎯 Прогнозы</button>
            <button type="button" class="tab-pill" onclick="switchTab('gallery', this)">📸 Фото</button>
            <button type="button" class="tab-pill" onclick="switchTab('shop', this)">Магазин</button>
            <button type="button" class="tab-pill" onclick="switchTab('fame', this)">🏆 Зал Славы</button>
        </nav>
    </div>

    <!-- ==========================================================================
         MODALS 
         ========================================================================== -->

        /**
         * ==========================================================================
         * RADAR CHART LOGIC (HTML5 CANVAS) FOR PLAYER PROFILES
         * ==========================================================================
         */
        function drawRadarChart(canvasId, stats) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 20;

            const labels = ['Скорость', 'Бросок', 'Пас', 'Защита', 'Сила'];
            const sides = labels.length;
            const angleStep = (Math.PI * 2) / sides;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Web
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const x = centerX + radius * Math.cos(i * angleStep - Math.PI/2);
                const y = centerY + radius * Math.sin(i * angleStep - Math.PI/2);
                ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.stroke();

            // Draw Data Polygon
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                // Normalize stat (assuming max 99)
                const val = (stats[i] || 50) / 99;
                const r = radius * val;
                const x = centerX + r * Math.cos(i * angleStep - Math.PI/2);
                const y = centerY + r * Math.sin(i * angleStep - Math.PI/2);
                ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 85, 0, 0.4)';
            ctx.fill();
            ctx.strokeStyle = '#ff5500';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
