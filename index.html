<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПХК Феникс - Live | Pro Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#ff5500">

    <!-- Firebase Core & Modules -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* ==========================================================================
           1. ROOT VARIABLES & THEMING
           ========================================================================== */
        :root { 
            /* Core Brand Colors */
            --primary: #ff5500; 
            --primary-glow: rgba(255, 85, 0, 0.4); 
            --primary-grad: linear-gradient(135deg, #ff5500, #cc4400);
            
            /* Dark Theme (Default) */
            --bg-dark: #0a0b10; 
            --glass-bg: rgba(255, 255, 255, 0.04); 
            --glass-border: rgba(255, 255, 255, 0.08); 
            --text-main: #ffffff; 
            --text-muted: #a0a5aa; 
            
            /* UI Settings */
            --card-shadow: 0 10px 30px rgba(0,0,0,0.3);
            --transition-speed: 0.3s;
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --border-radius-sm: 12px;
        }

        /* Light Theme Overrides */
        body[data-theme="light"] {
            --bg-dark: #f0f2f5; 
            --glass-bg: rgba(255, 255, 255, 0.7); 
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #111111; 
            --text-muted: #555555; 
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body[data-theme="light"] .player-card, 
        body[data-theme="light"] .fantasy-player-row { background: rgba(255,255,255,0.9); }
        body[data-theme="light"] .card-name, 
        body[data-theme="light"] .card-rating { color: #111111; text-shadow: none; }
        body[data-theme="light"] .admin-input { background: rgba(255,255,255,0.9); color: #111111; border-color: rgba(0,0,0,0.2); }
        body[data-theme="light"] .stats-tbl td, 
        body[data-theme="light"] .msg-text, 
        body[data-theme="light"] .news-text { color: #222222; }

        /* ==========================================================================
           2. BASE STYLES & TYPOGRAPHY
           ========================================================================== */
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh; 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            overflow-x: hidden; 
            scroll-behavior: smooth; 
            transition: background-color var(--transition-speed), color var(--transition-speed); 
        }

        /* ==========================================================================
           3. ANIMATIONS & EFFECTS
           ========================================================================== */
        .skeleton { 
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); 
            background-size: 200% 100%; 
            animation: skeleton-loading 1.5s infinite; 
            border-radius: var(--border-radius-md); 
            min-height: 100px; 
            margin-bottom: 15px; 
        }
        
        @keyframes skeleton-loading { 
            0% { background-position: 200% 0; } 
            100% { background-position: -200% 0; } 
        }

        @keyframes scaleIn { 
            from { opacity: 0; transform: translateY(15px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        @keyframes pulseAlert { 
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 64, 0.7); } 
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 64, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 64, 0); } 
        }

        .ambient-glow { 
            position: fixed; 
            width: 50vw; 
            height: 50vw; 
            max-width: 500px;
            max-height: 500px;
            background: var(--primary); 
            filter: blur(120px); 
            border-radius: 50%; 
            opacity: 0.12; 
            z-index: -1; 
            pointer-events: none; 
            transition: background 0.5s ease-in-out; 
        }
        
        .glow-1 { top: -10%; left: -10%; } 
        .glow-2 { bottom: 5%; right: -10%; opacity: 0.08; }

        /* ==========================================================================
           4. HEADER & NAVIGATION
           ========================================================================== */
        .top-bar { 
            position: relative; 
            z-index: 1000; 
            width: 100%; 
            padding-top: 15px; 
        }

        .header { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 10px 20px 5px; 
            position: relative; 
        }

        .logo-img-main { 
            height: 90px; 
            width: 90px; 
            border-radius: 50%; 
            object-fit: cover; 
            filter: drop-shadow(0 4px 15px var(--primary-glow)); 
            user-select: none; 
            transition: transform var(--transition-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 2px solid var(--glass-border);
        }

        .logo-img-main:hover { 
            transform: scale(1.08) rotate(3deg); 
        }
        
        .action-btn-top { 
            position: absolute; 
            top: 32px; 
            width: 46px; 
            height: 46px; 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 101; 
            backdrop-filter: blur(12px); 
            transition: all 0.2s ease; 
            font-size: 20px;
        }
        
        .menu-burger { right: 20px; flex-direction: column; gap: 5px; }
        .notif-bell { left: 20px; }
        .cart-btn { right: 80px; }
        .user-btn { left: 80px; }
        
        .action-btn-top:active { 
            transform: scale(0.85); 
            background: rgba(255,255,255,0.15); 
        }
        
        .menu-burger span { 
            width: 22px; 
            height: 2px; 
            background: var(--text-main); 
            border-radius: 2px; 
            pointer-events: none; 
            transition: 0.3s;
        }

        .badge-counter { 
            position: absolute; 
            top: -4px; 
            right: -4px; 
            background: #ff0040; 
            color: #ffffff; 
            font-size: 11px; 
            font-weight: 900; 
            min-width: 22px; 
            height: 22px; 
            border-radius: 11px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid var(--bg-dark); 
        }
        
        .notif-badge { animation: pulseAlert 2s infinite; }

        .top-nav { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding: 20px 20px 25px; 
            scrollbar-width: none; 
            z-index: 99; 
            position: relative; 
            -webkit-overflow-scrolling: touch;
        }
        
        .top-nav::-webkit-scrollbar { display: none; }
        
        .tab-pill { 
            background: var(--glass-bg); 
            color: var(--text-muted); 
            border: 1px solid var(--glass-border); 
            padding: 14px 24px; 
            border-radius: 24px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            white-space: nowrap; 
            transition: all var(--transition-speed) ease; 
            backdrop-filter: blur(10px); 
            letter-spacing: 0.3px;
        }
        
        .tab-pill:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
        }

        .tab-pill.active { 
            background: var(--primary-grad); 
            color: #ffffff; 
            border-color: transparent; 
            box-shadow: 0 8px 20px var(--primary-glow); 
            transform: translateY(-3px); 
        }

        .screen { 
            display: none; 
            padding: 0 20px 40px; 
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        
        .screen.active { display: block; }

        /* ==========================================================================
           5. UI CARDS & FORMS
           ========================================================================== */
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            border: 1px solid var(--glass-border); 
            border-radius: var(--border-radius-lg); 
            padding: 24px; 
            margin-bottom: 24px; 
            box-shadow: var(--card-shadow); 
            position: relative; 
            overflow: hidden; 
            transition: transform var(--transition-speed); 
        }

        .btn-action { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--glass-border); 
            color: var(--text-main); 
            padding: 10px 16px; 
            border-radius: var(--border-radius-sm); 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            margin-top: 15px; 
            transition: 0.2s; 
        }
        
        .btn-action:hover { 
            background: var(--primary-grad); 
            border-color: transparent; 
            color: #ffffff; 
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .admin-input { 
            width: 100%; 
            padding: 16px 20px; 
            background: rgba(0,0,0,0.4); 
            color: var(--text-main); 
            border: 1px solid var(--glass-border); 
            border-radius: var(--border-radius-md); 
            margin-bottom: 15px; 
            font-size: 15px; 
            transition: all 0.3s ease; 
            outline: none; 
        }

        .admin-input:focus { 
            border-color: var(--primary); 
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 0 4px rgba(255, 85, 0, 0.1);
        }
        
        .admin-btn-save { 
            background: var(--primary-grad); 
            color: #ffffff; 
            border: none; 
            padding: 18px; 
            border-radius: var(--border-radius-md); 
            font-weight: 800; 
            width: 100%; 
            cursor: pointer; 
            text-align: center; 
            display: block; 
            font-size: 16px; 
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px var(--primary-glow); 
            transition: all 0.2s; 
        }
        
        .admin-btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--primary-glow); 
        }

        .admin-btn-save:active { 
            transform: scale(0.96) translateY(0); 
        }

        .delete-btn { 
            display: none; 
            position: absolute; 
            top: 16px; 
            right: 16px; 
            background: rgba(255,50,50,0.9); 
            border: none; 
            color: #ffffff; 
            width: 32px; 
            height: 32px; 
            border-radius: 10px; 
            cursor: pointer; 
            z-index: 100; 
            font-size: 14px; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s;
        }
        
        .delete-btn:hover { background: rgba(255,0,0,1); transform: scale(1.1); }
        .is-admin .delete-btn { display: flex; }

        /* ==========================================================================
           6. NEWS, POLLS & MEDIA
           ========================================================================== */
        .news-date {
            font-size: 12px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .news-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 12px;
            color: var(--text-main);
            line-height: 1.3;
        }

        .news-text {
            font-size: 16px;
            color: var(--text-muted);
            white-space: pre-line;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .news-media {
            width: 100%;
            border-radius: var(--border-radius-md);
            margin-bottom: 20px;
            object-fit: cover;
            max-height: 400px;
            border: 1px solid var(--glass-border);
        }

        .news-actions { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px; 
            border-top: 1px solid var(--glass-border); 
            padding-top: 20px; 
        }
        
        .news-comments-section { 
            margin-top: 20px; 
            background: rgba(0,0,0,0.2); 
            border-radius: var(--border-radius-md); 
            padding: 20px; 
            border: 1px solid var(--glass-border);
        }
        
        .news-comment { 
            background: rgba(255,255,255,0.02); 
            padding: 12px 16px; 
            border-radius: var(--border-radius-sm); 
            font-size: 14px; 
            position: relative; 
            border-left: 3px solid var(--primary); 
            margin-bottom: 12px; 
            color: var(--text-main); 
            line-height: 1.5;
        }
        
        .nc-name { 
            font-size: 12px; 
            color: var(--primary); 
            font-weight: 800; 
            margin-bottom: 6px; 
        }

        .poll-container { 
            margin-top: 20px; 
            background: rgba(0,0,0,0.4); 
            padding: 20px; 
            border-radius: var(--border-radius-md); 
            border: 1px solid var(--glass-border); 
        }
        
        .poll-option { 
            background: rgba(255,255,255,0.03); 
            padding: 14px 18px; 
            border-radius: var(--border-radius-sm); 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            position: relative; 
            overflow: hidden; 
            border: 1px solid transparent;
        }
        
        .poll-option:hover { 
            background: rgba(255,255,255,0.08); 
            border-color: var(--glass-border);
        }
        
        .poll-fill { 
            position: absolute; 
            left: 0; top: 0; bottom: 0; 
            background: var(--primary-glow); 
            z-index: 0; 
            width: 0%; 
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        .poll-text { 
            position: relative; 
            z-index: 1; 
            font-weight: 700; 
            font-size: 15px; 
            color: var(--text-main); 
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- 
        ==========================================================================
        GLOBAL HEADER & NAVIGATION
        ========================================================================== 
    -->
    <div class="top-bar">
        <div class="action-btn-top user-btn" id="btnUserAuth" title="Профиль болельщика">👤</div>
        <div class="action-btn-top notif-bell" id="btnNotifications" title="Уведомления">🔔<span class="badge-counter notif-badge" id="notifBadge" style="display:none;">0</span></div>
        <div class="action-btn-top cart-btn" id="btnShoppingCart" title="Корзина">🛒<span class="badge-counter" id="cartBadge" style="display:none;">0</span></div>
        <div class="action-btn-top menu-burger" id="btnSettingsMenu" title="Меню"><span></span><span></span><span></span></div>
        
        <header class="header">
            <img id="mainLogoElement" src="1335.jpg" alt="ФЕНИКС" class="logo-img-main">
        </header>

        <nav class="top-nav" id="mainNav">
            <!-- Navigation buttons will be linked via JS logic in Part 2 -->
            <button type="button" class="tab-pill active" data-target="news">Главная</button>
            <button type="button" class="tab-pill" data-target="fantasy" style="color:var(--primary); border-color:var(--primary);">🔮 Фэнтези</button>
            <button type="button" class="tab-pill" data-target="squad">Состав</button>
            <button type="button" class="tab-pill" data-target="calendar">Календарь</button>
            <button type="button" class="tab-pill" data-target="live">🔴 Live</button>
            <button type="button" class="tab-pill" data-target="stats">📊 Стат</button>
            <button type="button" class="tab-pill" data-target="predictions">🎯 Прогнозы</button>
            <button type="button" class="tab-pill" data-target="gallery">📸 Фото</button>
            <button type="button" class="tab-pill" data-target="shop">Магазин</button>
            <button type="button" class="tab-pill" data-target="fame">🏆 История</button>
        </nav>
    </div>

    <!-- 
        ==========================================================================
        MAIN SCREENS (TABS) - Content injected via JS in Part 2 & 3
        ========================================================================== 
    -->
    
    <!-- SCREEN: NEWS (Home) -->
    <div id="screen-news" class="screen active">
        <div id="nextMatchWidgetContainer">
            <div class="skeleton"></div>
        </div>
        
        <div id="newsContainer">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
        
        <!-- Admin Controls for News -->
        <div class="admin-controls" id="admin-news">
            <!-- Controls will be populated in HTML/JS later -->
        </div>
    </div>

    <!-- SCREEN: FANTASY LEAGUE -->
    <div id="screen-fantasy" class="screen">
        <div class="glass-card" style="text-align: center;">
            <div class="skeleton" style="height: 40px; width: 60%; margin: 0 auto 20px;"></div>
            <div class="skeleton" style="height: 380px;"></div>
            <div class="skeleton" style="height: 150px; margin-top: 20px;"></div>
        </div>
    </div>

    <!-- SCREEN: SQUAD -->
    <div id="screen-squad" class="screen">
        <div class="glass-card" style="padding: 0; background: transparent; border: none; box-shadow: none;">
            <div class="skeleton" style="height: 520px; border-radius: 28px;"></div>
        </div>
        <h3 style="color:var(--primary); margin: 20px 0; text-transform: uppercase;">Запасные</h3>
        <div id="benchContainer" style="display: flex; gap: 15px; overflow-x: auto;">
            <div class="skeleton" style="width: 76px; height: 116px; flex-shrink: 0;"></div>
            <div class="skeleton" style="width: 76px; height: 116px; flex-shrink: 0;"></div>
        </div>
    </div>

    <!-- Placeholders for the rest of the screens to maintain valid DOM -->
    <div id="screen-calendar" class="screen"><div class="skeleton"></div></div>
    <div id="screen-schedule" class="screen"><div class="skeleton"></div></div>
    <div id="screen-live" class="screen"><div class="skeleton"></div></div>
    <div id="screen-stats" class="screen"><div class="skeleton"></div></div>
    <div id="screen-predictions" class="screen"><div class="skeleton"></div></div>
    <div id="screen-gallery" class="screen"><div class="skeleton"></div></div>
    <div id="screen-shop" class="screen"><div class="skeleton"></div></div>
    <div id="screen-fame" class="screen"><div class="skeleton"></div></div>
 
    <!-- 
        ==========================================================================
        JAVASCRIPT CORE ENGINE (PART 2)
        ========================================================================== 
    -->
    <script>
        /**
         * ==========================================================================
         * 1. FIREBASE CONFIGURATION & INITIALIZATION
         * ==========================================================================
         * Связь с облачной базой данных, хранилищем и системой авторизации.
         */
        const firebaseConfig = {
            apiKey: "AIzaSyDsxGKTwHzLPwep_7EYiHHKAxsBwbJ-uEM", 
            authDomain: "phoenix-9adab.firebaseapp.com",
            databaseURL: "https://phoenix-9adab-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "phoenix-9adab",
            storageBucket: "phoenix-9adab.firebasestorage.app", 
            messagingSenderId: "935773473607", 
            appId: "1:935773473607:web:4eecd7e05cd4ce2389da62"
        };

        // Защита от повторной инициализации
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log("[Core] Firebase инициализирован успешно.");
        }

        const db = firebase.database(); 
        const storage = firebase.storage();
        const auth = firebase.auth();

        /**
         * ==========================================================================
         * 2. GLOBAL STATE MANAGEMENT
         * ==========================================================================
         * Централизованное хранилище данных приложения (Single Source of Truth).
         */
        let isAdmin = false; 
        let currentUser = null;
        let openNewsComments = {}; // Состояние открытых комментариев для новостей
        const fanNames = ["Болельщик", "Фанат", "Ультрас", "PhoenixFan", "Игрок"]; // Дефолтные имена
        
        // Главный объект данных (кэш базы)
        let localData = { 
            news: {}, 
            players: {}, 
            nextMatch: null, 
            design: null, 
            social: null 
            // Остальные узлы (stats, shop, fantasy) подтянутся в Части 3
        };

        /**
         * Подписка на базовые узлы БД (Новостная лента, Состав, Дизайн).
         * Данные обновляются в реальном времени у всех пользователей.
         */
        const coreRefs = ['news', 'players', 'nextMatch', 'design', 'social'];
        coreRefs.forEach(ref => {
            db.ref(ref).on('value', snap => { 
                localData[ref] = snap.val() || null; 
                console.log(`[DB Sync] Обновлен узел: ${ref}`);
                renderCoreUI(); 
            });
        });

        /**
         * ==========================================================================
         * 3. NAVIGATION & UI CONTROLS
         * ==========================================================================
         */
        
        /**
         * Переключение вкладок (Экранов)
         * @param {string} tabId - ID целевого экрана (например, 'news', 'squad')
         * @param {HTMLElement} btn - Нажатая кнопка
         */
        function switchTab(tabId, btn) { 
            try {
                // Скрываем все экраны
                document.querySelectorAll('.screen').forEach(s => {
                    s.classList.remove('active');
                }); 
                
                // Показываем нужный экран
                const targetScreen = document.getElementById('screen-' + tabId);
                if (targetScreen) targetScreen.classList.add('active'); 
                
                // Обновляем состояние кнопок навигации
                document.querySelectorAll('.tab-pill').forEach(b => {
                    b.classList.remove('active');
                    // Сброс специфичных стилей (например, для Фэнтези)
                    if (b.dataset.target === 'fantasy') {
                        b.style.color = 'var(--primary)'; 
                        b.style.borderColor = 'var(--primary)';
                    }
                }); 
                
                btn.classList.add('active');
                
                // Убираем цветные рамки у Фэнтези, если она активна
                if (tabId === 'fantasy') {
                    btn.style.color = '#fff';
                    btn.style.borderColor = 'transparent';
                }
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                console.error("[Navigation Error]", error);
            }
        }

        // Подключаем слушатели для кнопок меню из Части 1
        document.getElementById('mainNav').addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' && e.target.classList.contains('tab-pill')) {
                switchTab(e.target.dataset.target, e.target);
            }
        });

        // Слушатели верхних кнопок (Модалки)
        document.getElementById('btnSettingsMenu').onclick = () => document.getElementById('socialModal').classList.toggle('active');
        document.getElementById('btnUserAuth').onclick = () => document.getElementById('authModal').classList.add('active');
        // Заглушки для уведомлений и корзины (логика в Части 3)
        document.getElementById('btnNotifications').onclick = () => alert("Уведомления будут доступны в следующей части!");
        document.getElementById('btnShoppingCart').onclick = () => alert("Корзина будет доступна в следующей части!");

        /**
         * ==========================================================================
         * 5. FILE UPLOAD ENGINE (Firebase Storage)
         * ==========================================================================
         */
        
        /**
         * Асинхронно загружает файл в Firebase Storage и возвращает прямую ссылку.
         * Защита от тяжелых файлов (> 5 МБ).
         * @param {string} inputId - ID элемента <input type="file">
         * @returns {Promise<string>} - URL загруженного изображения или пустая строка
         */
        async function processFilePromise(inputId) {
            return new Promise((resolve, reject) => {
                let fileInput = document.getElementById(inputId);
                
                if (!fileInput || !fileInput.files[0]) { 
                    resolve(""); // Файл не выбран, возвращаем пустоту
                    return; 
                }
                
                let file = fileInput.files[0];
                
                // Проверка лимита (5 MB = 5 * 1024 * 1024 bytes)
                const MAX_SIZE = 5 * 1024 * 1024;
                if (file.size > MAX_SIZE) { 
                    alert("Ошибка: Файл слишком большой! Максимальный размер 5 МБ."); 
                    resolve(""); 
                    return; 
                }
                
                // Формируем уникальное имя файла
                const uniqueFileName = 'uploads/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
                const storageRef = storage.ref(uniqueFileName); 
                
                console.log(`[Storage] Начало загрузки файла: ${uniqueFileName}`);
                const uploadTask = storageRef.put(file);
                
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        // Опционально: можно добавить расчет прогресса (progress bar)
                        // const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    }, 
                    (error) => { 
                        console.error("[Storage Error]", error);
                        alert("Ошибка загрузки файла.");
                        resolve(""); 
                    }, 
                    () => { 
                        // Успешная загрузка, получаем URL
                        uploadTask.snapshot.ref.getDownloadURL().then((url) => {
                            console.log("[Storage] Файл успешно загружен:", url);
                            resolve(url);
                        }); 
                    }
                );
            });
        }

        /**
         * Отрисовка Новостной ленты (Posts, Media, Polls, Comments)
         */
        function renderNews() {
            const container = document.getElementById('newsContainer');
            if(!container) return;

            const newsData = localData.news || {};
            const newsEntries = Object.entries(newsData).reverse(); // Свежие новости сверху

            if(newsEntries.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:40px 0;">Новостей пока нет</div>';
                return;
            }

            let html = '';
            
            newsEntries.forEach(([id, post]) => {
                let mediaHtml = '';
                let pollHtml = '';
                
                // 1. Рендер Видео
                if(post.video) {
                    if(post.video.includes('youtu')) { 
                        // Извлекаем ID Youtube видео
                        let vId = post.video.includes('v=') ? post.video.split('v=')[1] : post.video.split('youtu.be/')[1];
                        if(vId) vId = vId.split('&')[0];
                        mediaHtml = `<iframe class="news-media" src="https://www.youtube.com/embed/${vId}" frameborder="0" allowfullscreen></iframe>`; 
                    } else {
                        mediaHtml = `<video class="news-media" controls><source src="${post.video}"></video>`;
                    }
                }

                // 2. Рендер Опросов
                if(post.pollOptions && post.pollOptions.length > 0) {
                    let totalVotes = 0; 
                    let votes = post.pollVotes || {}; 
                    Object.values(votes).forEach(v => totalVotes += v);
                    
                    pollHtml = `<div class="poll-container"><div style="color:var(--primary); font-weight:800; margin-bottom:15px;">📊 Опрос</div>`;
                    
                    post.pollOptions.forEach((opt, idx) => { 
                        let pct = totalVotes === 0 ? 0 : Math.round(((votes[idx]||0)/totalVotes)*100); 
                        pollHtml += `
                            <div class="poll-option" onclick="votePoll('${id}', ${idx})">
                                <div class="poll-fill" style="width: ${pct}%"></div>
                                <div class="poll-text"><span>${opt}</span><span>${pct}%</span></div>
                            </div>
                        `; 
                    }); 
                    pollHtml += `</div>`;
                }

                // 3. Рендер Комментариев
                let commentsObj = post.comments || {}; 
                let commentsHtml = Object.entries(commentsObj).map(([cId, c]) => `
                    <div class="news-comment">
                        <div class="nc-name">${c.name}</div>
                        <div>${c.text}</div>
                        ${isAdmin ? `<span class="delete-btn" style="top:5px;right:5px;width:20px;height:20px;font-size:10px;" onclick="db.ref('news/${id}/comments/${cId}').remove()">✖</span>` : ''}
                    </div>
                `).join('');
                
                let interactionPanel = `
                    <div class="news-actions">
                        <button type="button" class="btn-action" style="margin-top:0;" onclick="likeNews('${id}')">❤️ ${post.likes||0}</button>
                        <button type="button" class="btn-action" style="margin-top:0;" onclick="toggleNewsComments('${id}')">💬 ${Object.keys(commentsObj).length}</button>
                    </div>
                    <div class="news-comments-section" style="display: ${openNewsComments[id] ? 'block' : 'none'};">
                        <div style="max-height:250px;overflow-y:auto;margin-bottom:15px;padding-right:5px;">
                            ${commentsHtml || '<div style="color:var(--text-muted);font-size:13px;">Будьте первым, кто оставит комментарий!</div>'}
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="nc-input-${id}" placeholder="Ваш комментарий..." class="admin-input" style="margin:0; padding:12px;">
                            <button type="button" class="admin-btn-save" style="width:50px; padding:0; display:flex; align-items:center; justify-content:center;" onclick="sendNewsComment('${id}')">➤</button>
                        </div>
                    </div>
                `;

                // 4. Основная картинка
                let imgHtml = post.img ? `<img src="${post.img}" class="news-media" loading="lazy">` : '';
                
                // 5. Кнопка удаления
                let delBtn = isAdmin ? `<button type="button" class="delete-btn" onclick="db.ref('news/${id}').remove()">✖</button>` : '';

                // Сборка поста
                html += `
                    <div class="glass-card">
                        ${delBtn}
                        ${imgHtml}
                        <div class="news-date">${post.date || ''}</div>
                        <div class="news-title">${post.title || 'Без заголовка'}</div>
                        <div class="news-text">${post.text || ''}</div>
                        ${mediaHtml}
                        ${pollHtml}
                        ${interactionPanel}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

            let currentVotes = localData.news[newsId].pollVotes || {};

            db.ref(`news/${newsId}/pollVotes`).set(currentVotes); 
            voted[newsId] = true; 
            localStorage.setItem('phx_voted_polls', JSON.stringify(voted));

        const FANTASY_MAX_BUDGET = 100.0;
        let fantasyState = {
            budget: FANTASY_MAX_BUDGET,
            activeFilter: null,
            squad: {
                'pos-lw': null, 'pos-c': null, 'pos-rw': null,
                'pos-ld': null, 'pos-rd': null, 'pos-gk': null
            }
        };

        const posNamesDisplay = {
            'pos-lw': 'Левый Нападающий', 'pos-c': 'Центр', 'pos-rw': 'Правый Нападающий',
            'pos-ld': 'Левый Защитник', 'pos-rd': 'Правый Защитник', 'pos-gk': 'Вратарь'
        };

        /**
         * Расчет виртуальной стоимости игрока на основе его рейтинга
         */
        function calculatePlayerPrice(rating) {
            let base = parseInt(rating) || 50;
            // Пример формулы: рейтинг 80 = 20 млн, рейтинг 90 = 25 млн
            let price = (base - 40) * 0.5;
            return Math.max(5.0, price).toFixed(1);
        }

        window.selectFantasyPos = function(posId) {
            fantasyState.activeFilter = posId;
            const draftPosTitle = document.getElementById('currentDraftPos');
            if(draftPosTitle) draftPosTitle.innerText = posNamesDisplay[posId];
            
            // Подсветка активного слота на площадке
            document.querySelectorAll('.fantasy-slot').forEach(el => el.style.borderColor = 'var(--glass-border)');
            const activeSlot = document.getElementById(`f-slot-${posId.split('-')[1]}`);
            if(activeSlot) activeSlot.style.borderColor = 'var(--primary)';
            
            renderFantasyPool();
        }

        function renderFantasyPool() {
            const poolContainer = document.getElementById('fantasyPlayerPool');
            if(!poolContainer) return;
            poolContainer.innerHTML = '';

            let playersArr = Object.entries(localData.players || {});
            
            // Фильтрация игроков по выбранной позиции (основа + запасные)
            if(fantasyState.activeFilter) {
                playersArr = playersArr.filter(([id, p]) => {
                    return id === fantasyState.activeFilter || id.includes('bench');
                });
            }

            if(playersArr.length === 0) {
                poolContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Выберите позицию на льду или нет доступных игроков.</div>';
                return;
            }

            playersArr.forEach(([id, p]) => {
                // Если игрок уже в составе, не выводим его в список
                let isAlreadyDrafted = Object.values(fantasyState.squad).some(s => s && s.id === id);
                if(isAlreadyDrafted) return;

                let price = parseFloat(calculatePlayerPrice(p.baseRating));
                let canAfford = fantasyState.budget >= price;
                let bg = p.photo ? `url('${p.photo}')` : `url('https://ui-avatars.com/api/?name=${p.name}&background=111&color=fff')`;

                let row = document.createElement('div');
                row.className = 'fantasy-player-row';
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:40px; height:40px; border-radius:50%; background-image:${bg}; background-size:cover;"></div>
                        <div class="fp-info">
                            <span class="fp-name">${p.name}</span>
                            <span class="fp-meta">Рейтинг: ${p.baseRating || 50} | ${p.posName}</span>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span class="fp-price" style="color:${canAfford ? 'var(--primary)' : '#ff4444'}">${price}M</span>
                        <button class="fp-add-btn" ${!canAfford ? 'disabled' : ''} onclick="draftPlayer('${id}', '${p.name}', '${p.photo}', ${price})">+</button>
                    </div>
                `;
                poolContainer.appendChild(row);
            });
        }

        window.draftPlayer = function(playerId, name, photo, price) {
            if(!fantasyState.activeFilter) return alert("Сначала выберите позицию на площадке!");
            
            let slot = fantasyState.activeFilter;
            
            // Если слот занят, возвращаем деньги за старого игрока
            if(fantasyState.squad[slot]) {
                fantasyState.budget += fantasyState.squad[slot].price;
            }

            if(fantasyState.budget < price) return alert("Не хватает бюджета!");

            // Добавляем нового
            fantasyState.squad[slot] = { id: playerId, name: name, photo: photo, price: price };
            fantasyState.budget -= price;
            
            updateFantasyUI();
        }

        window.removeDraftedPlayer = function(slot, event) {
            event.stopPropagation(); 
            if(fantasyState.squad[slot]) {
                fantasyState.budget += fantasyState.squad[slot].price;
                fantasyState.squad[slot] = null;
                updateFantasyUI();

        function updateFantasyUI() {
            const bEl = document.getElementById('fantasyBudgetVal');
            if(bEl) {
                bEl.innerText = fantasyState.budget.toFixed(1);
                bEl.className = fantasyState.budget < 10 ? 'danger' : (fantasyState.budget < 30 ? 'warning' : '');
            }

            Object.keys(fantasyState.squad).forEach(slot => {
                let slotId = `f-slot-${slot.split('-')[1]}`;
                let el = document.getElementById(slotId);
                let p = fantasyState.squad[slot];
                
                if(el) {
                    if(p) {
                        let bg = p.photo ? `url('${p.photo}')` : `url('https://ui-avatars.com/api/?name=${p.name}&background=111&color=fff')`;
                        el.classList.add('filled');
                        el.innerHTML = `
                            <div class="remove-icon" onclick="removeDraftedPlayer('${slot}', event)">✕</div>
                            <div style="width:36px; height:36px; border-radius:50%; background-image:${bg}; background-size:cover; margin-bottom:4px; border:1px solid var(--primary);"></div>
                            <div style="font-size:9px; color:#fff; text-overflow:ellipsis; overflow:hidden; width:100%; text-align:center; white-space:nowrap;">${p.name}</div>
                        `;
                    } else {
                        el.classList.remove('filled');
                        let labels = {'pos-lw':'ЛН', 'pos-c':'ЦН', 'pos-rw':'ПН', 'pos-ld':'ЛЗ', 'pos-rd':'ПЗ', 'pos-gk':'ВР'};
                        el.innerHTML = labels[slot];
                    }
                }
            });
            renderFantasyPool();
        }

            db.ref('shop').push({ 
                name: name, 
                price: price, 
                img: imgData || "📦" // Фолбек иконка
            }).then(() => {
                alert('Товар успешно добавлен в магазин!');
                document.getElementById('sName').value = '';
                document.getElementById('sPriceNum').value = '';
            });
        }

        window.saveMatch = async function() {
            let imgData = await processFilePromise('mLogoOFile');
            
            db.ref('matches').push({ 
                type: document.getElementById('mType').value, 
                opponent: document.getElementById('mOpponent').value || "Соперник", 
                date: document.getElementById('mDateRawC').value, 
                scoreF: document.getElementById('mScoreF').value || "-", 
                scoreO: document.getElementById('mScoreO').value || "-", 
                logoO: imgData 
            }).then(() => alert("Матч добавлен в календарь!"));
        }

        window.saveScheduleItem = function() { 
            db.ref('schedule').push({ 
                day: document.getElementById('schedDay').value, 
                time: document.getElementById('schedTime').value || "12:00", 
                place: document.getElementById('schedPlace').value || "Арена", 
                type: document.getElementById('schedType').value 
            }).then(() => alert('Событие добавлено в расписание!')); 
        }

        window.createPrediction = function() { 
            let match = document.getElementById('predMatch').value.trim();
            let date = document.getElementById('predDate').value;
            if(!match) return alert("Введите название матча!");

            db.ref('predictions').push({ 
                match: match, 
                date: date, 
                closed: false, 
                entries: {} 
            }).then(() => alert('Голосование за прогноз создано!')); 
        }

        window.closePrediction = function(id) {
            let ah = parseInt(document.getElementById('ah-'+id).value);
            let aa = parseInt(document.getElementById('aa-'+id).value); 
            if(isNaN(ah) || isNaN(aa)) return alert("Введите реальный счет завершенного матча!");
            
            db.ref('predictions/'+id).update({ 
                closed: true, 
                actualHome: ah, 
                actualAway: aa 
            }).then(() => alert("Прогноз закрыт! Итоги подведены."));
        }

        window.saveGalleryPhoto = async function() { 
            let album = document.getElementById('galAlbum').value.trim() || 'Фото с матча';
            let img = await processFilePromise('galPhotoFile'); 
            if(!img) return alert("Выберите фотографию!"); 
            
            db.ref('gallery').push({ 
                album: album, 
                img: img 
            }).then(() => alert('Фотография успешно загружена в галерею!')); 
        }

        /**
         * ==========================================================================
         * 14. LIVE MATCH CONTROLS (ADMIN ONLY)
         * ==========================================================================
         */
        window.startLiveMatch = function() { 
            let home = document.getElementById('liveHome').value || 'Феникс';
            let away = document.getElementById('liveAway').value || 'Гости';
            
            db.ref('liveMatch').set({ 
                active: true, 
                homeTeam: home, 
                awayTeam: away, 
                homeScore: 0, 
                awayScore: 0, 
                period: 1, 
                events: {}, 
                attendance: { arena: 0, online: 0 } 
            }).then(() => alert("Live-трансляция начата!")); 
        }

        window.endLiveMatch = function() { 
            let lm = localData.liveMatch; 
            if(!lm || !lm.active) return alert("Матч не запущен.");
            
            if(confirm('Вы уверены, что хотите завершить Live-матч? Данные табло сбросятся.')) { 
                if(lm.homeScore > lm.awayScore && typeof fireConfetti === 'function') {
                    fireConfetti(); // Победа Феникса!
                }
                db.ref('liveMatch').set(null).then(() => alert("Матч завершен.")); 
            } 
        }

        window.liveScoreChange = function(team, delta) { 
            let key = team === 'home' ? 'homeScore' : 'awayScore'; 
            if(localData.liveMatch && localData.liveMatch.active) {
                let currentScore = localData.liveMatch[key] || 0;
                db.ref('liveMatch/' + key).set(Math.max(0, currentScore + delta)); 
            } else {
                alert("Сначала начните матч!");
            }
        }

        window.setLivePeriod = function() { 
            let period = document.getElementById('livePeriod').value;
            if(localData.liveMatch && localData.liveMatch.active) {
                db.ref('liveMatch/period').set(period); 
            }
        }

    </script>

    </script>

</body>
</html>
