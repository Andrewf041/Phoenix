<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПХК Феникс - Live</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #ff5500; --primary-glow: rgba(255, 85, 0, 0.6); --bg-dark: #050301; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-muted: #a0a0a0; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed; }
        .ambient-glow { position: fixed; width: 350px; height: 350px; background: var(--primary); filter: blur(120px); border-radius: 50%; opacity: 0.25; z-index: -1; pointer-events: none; }
        .glow-1 { top: -100px; left: -100px; } .glow-2 { bottom: 10%; right: -150px; opacity: 0.2; }

        .header { display: flex; justify-content: center; align-items: center; padding: 15px 20px 10px; position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(5,3,1,0.98) 0%, rgba(5,3,1,0) 100%); height: 95px; }
        .logo-img-main { height: 80px; width: auto; max-width: 200px; object-fit: contain; filter: drop-shadow(0 0 15px var(--primary-glow)); user-select: none; -webkit-user-select: none; }
        
        .menu-burger { position: absolute; right: 20px; top: 28px; width: 40px; height: 40px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; z-index: 101; backdrop-filter: blur(10px); }
        .menu-burger span { width: 18px; height: 2px; background: #fff; border-radius: 2px; pointer-events: none; }

        .social-dropdown { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 20px; }
        .social-dropdown.active { display: flex; animation: scaleIn 0.2s; }
        .social-box { background: #12141a; border: 1px solid var(--glass-border); border-radius: 28px; width: 100%; max-width: 320px; padding: 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .social-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: #fff; }
        .social-link { display: block; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; text-decoration: none; padding: 14px; border-radius: 16px; font-weight: 700; margin-bottom: 12px; transition: 0.2s; }
        .social-link:active { background: var(--primary); }
        .dev-trigger { margin-top: 25px; font-size: 12px; color: var(--text-muted); cursor: pointer; text-decoration: underline; background: none; border: none; }

        .top-nav { display: flex; gap: 12px; overflow-x: auto; padding: 10px 20px 20px; scrollbar-width: none; z-index: 99; position: relative; }
        .top-nav::-webkit-scrollbar { display: none; }
        .tab-pill { background: var(--glass-bg); color: var(--text-muted); border: 1px solid var(--glass-border); padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; backdrop-filter: blur(10px); }
        .tab-pill.active { background: rgba(0,0,0,0.6); color: var(--text-main); border-color: var(--primary); box-shadow: inset 0 0 15px rgba(255,255,255,0.02), 0 0 12px var(--primary-glow); }

        .screen { display: none; padding: 0 20px 40px; animation: scaleIn 0.3s ease-out; }
        .screen.active { display: block; }
        @keyframes scaleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .next-match-widget { background: linear-gradient(135deg, rgba(255,85,0,0.15) 0%, rgba(0,0,0,0.6) 100%); border: 1px solid var(--primary); border-radius: 24px; padding: 18px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .next-match-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .next-match-teams { display: flex; justify-content: space-between; align-items: center; }
        .nm-team { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
        .nm-logo { width: 36px; height: 36px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid var(--glass-border); overflow: hidden; }
        .nm-logo img { width: 100%; height: 100%; object-fit: contain; }
        .nm-vs { font-weight: 900; color: var(--text-muted); font-size: 14px; }
        .nm-info { margin-top: 12px; font-size: 12px; color: var(--text-muted); text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 28px; padding: 20px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        
        /* Новый стиль новостей */
        .news-main-img { width: 100%; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--glass-border); object-fit: cover; max-height: 300px; display: block; }
        .news-date { font-size: 11px; color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
        .news-title { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
        .news-text { font-size: 14px; color: #ccc; line-height: 1.4; margin-bottom: 10px; white-space: pre-line; }
        .news-video { width: 100%; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--glass-border); }

        .news-actions { display: flex; gap: 10px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
        .na-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 6px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .news-comments-section { margin-top: 12px; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 12px; }
        .nc-list { max-height: 180px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .news-comment { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; font-size: 13px; position: relative; }
        .nc-name { font-size: 10px; color: var(--primary); font-weight: 700; margin-bottom: 3px; }
        .nc-del { position: absolute; right: 8px; top: 8px; color: red; cursor: pointer; font-size: 12px; display: none; }
        .is-admin .nc-del { display: block; }
        .nc-input-row { display: flex; gap: 8px; }
        .nc-input { flex-grow: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 13px; outline: none; }
        .nc-send { background: var(--primary); border: none; width: 32px; height: 32px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }

        .match-header { font-size: 12px; color: var(--primary); text-align: center; margin-bottom: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .team-block { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .team-logo { width: 55px; height: 55px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 26px; border: 1px solid var(--glass-border); overflow: hidden; }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
        .team-name { font-size: 13px; font-weight: 700; text-align: center; }
        .score-pill { background: rgba(0,0,0,0.6); border: 1px solid var(--primary); border-radius: 20px; padding: 8px 24px; font-size: 26px; font-weight: 900; box-shadow: 0 0 20px var(--primary-glow); margin-bottom: 6px; text-align:center; }
        .match-time { font-size: 12px; color: var(--text-muted); text-align:center; }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .shop-img { width: 80px; height: 80px; margin-bottom: 12px; object-fit: contain; font-size: 55px; line-height: 80px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); border-radius: 16px; }
        .shop-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #eee; }
        .shop-price { font-size: 17px; font-weight: 900; color: var(--primary); }

        .field { background: linear-gradient(180deg, #16181f 0%, #0d0e12 100%); border: 2px solid var(--glass-border); border-radius: 28px; height: 520px; position: relative; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.9); margin-top: 10px;}
        .line-center { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.15); transform: translateY(-50%); }
        .circle-center { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal-area { position: absolute; left: 50%; width: 140px; height: 45px; border: 2px solid rgba(255,255,255,0.15); transform: translateX(-50%); }
        .goal-top { top: -2px; border-top: none; border-radius: 0 0 25px 25px; }
        .goal-bottom { bottom: -2px; border-bottom: none; border-radius: 25px 25px 0 0; }
        
        .bench-header { font-size: 16px; font-weight: 800; margin: 25px 0 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .bench-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .bench-container::-webkit-scrollbar { display: none; }
        
        .player-card { width: 72px; height: 110px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border: 1px solid var(--primary); border-radius: 12px; position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; padding: 6px 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .player-card.bench { position: relative; transform: none; flex-shrink: 0; left: 0; top: 0; margin-top: 10px; }
        
        .card-rating { font-size: 19px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 0 10px var(--primary-glow); }
        .card-pos { font-size: 10px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .card-photo { width: 44px; height: 44px; background: #222; border-radius: 50%; background-size: cover; background-position: center; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.3); }
        .card-name { font-size: 10px; font-weight: 700; color: #eee; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        
        .pos-c { top: 22%; left: 50%; } .pos-lw { top: 38%; left: 22%; } .pos-rw { top: 38%; left: 78%; } .pos-ld { top: 68%; left: 28%; } .pos-rd { top: 68%; left: 72%; } .pos-gk { top: 88%; left: 50%; }

        .chat-section { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 28px; padding: 20px; backdrop-filter: blur(15px); margin-top: 10px; }
        .chat-header { font-size: 16px; font-weight: 800; margin-bottom: 15px; color: var(--primary); }
        .chat-messages { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; padding-right: 5px; }
        .msg { display: flex; gap: 12px; align-items: flex-end; position: relative; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #aa3300); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; color:#fff; }
        .msg-content { background: rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 20px 20px 20px 0; border: 1px solid rgba(255,255,255,0.05); max-width: 85%; }
        .msg-name { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .msg-text { font-size: 14px; color: #fff; line-height: 1.3; }
        .chat-input-area { display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 30px; border: 1px solid var(--glass-border); }
        .chat-input { flex-grow: 1; background: transparent; border: none; color: #fff; padding: 10px 15px; font-size: 14px; outline: none; }
        .chat-send { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .vote-row { display: flex; gap: 10px; }
        .vote-select { flex-grow: 2; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--glass-border); padding: 14px; border-radius: 16px; outline: none; }
        .vote-input { flex-grow: 1; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--glass-border); padding: 14px; border-radius: 16px; text-align: center; width: 80px; }
        .vote-btn { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 16px; font-weight: 800; cursor: pointer; width:100%; margin-top:10px; }

        .admin-controls { display: none; margin-top: 30px; border-top: 2px dashed var(--primary); padding-top: 20px; }
        .is-admin .admin-controls { display: block; }
        
        .delete-btn { display: none; position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.9); border: 1px solid red; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 100; font-size: 14px; align-items: center; justify-content: center; }
        .msg .delete-btn { top: 0; right: -40px; }
        .player-card .delete-btn { top: -10px; right: -10px; width: 25px; height: 25px; font-size: 12px; }
        .is-admin .delete-btn { display: flex; }

        .admin-input { width: 100%; padding: 16px; background: #08090b; color: #fff; border: 1px solid #2a2d35; border-radius: 16px; margin-bottom: 15px; font-size: 14px; }
        .input-row { display: flex; gap: 10px; }
        input[type="file"] { padding: 12px; background: #08090b; color: #888; font-size: 12px; }
        .admin-btn-save { background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; text-align: center; display: block; }
    </style>
</head>
<body>

    <div class="menu-burger" onclick="toggleSocialMenu()">
        <span></span><span></span><span></span>
    </div>

    <!-- Меню соцсетей -->
    <div class="social-dropdown" id="socialModal" onclick="if(event.target === this) toggleSocialMenu()">
        <div class="social-box">
            <div class="social-title">Наши соцсети</div>
            <div id="socialLinksContainer"></div>
            <button type="button" class="dev-trigger" onclick="openPasswordModal()">Для разработчика</button>
        </div>
    </div>

    <!-- Надежное окно ввода пароля с формой -->
    <div class="social-dropdown" id="passwordModal" onclick="if(event.target === this) closePasswordModal()">
        <form class="social-box" onsubmit="event.preventDefault(); checkDevPassword();">
            <div class="social-title">🔒 Вход для разработчика</div>
            <input type="password" id="devPassInput" class="admin-input" placeholder="Пароль" style="text-align: center;" autocomplete="off">
            <button type="submit" class="admin-btn-save">Войти</button>
            <button type="button" class="dev-trigger" onclick="closePasswordModal()" style="margin-top:15px; width:100%;">Отмена</button>
        </form>
    </div>

    <div class="ambient-glow glow-1" id="glow1"></div>
    <div class="ambient-glow glow-2" id="glow2"></div>

    <header class="header">
        <img id="mainLogoElement" src="1335.jpg" alt="ФЕНИКС" class="logo-img-main" onerror="this.src='https://ui-avatars.com/api/?name=PH&background=ff5500&color=fff'">
    </header>

    <nav class="top-nav">
        <button type="button" class="tab-pill active" onclick="switchTab('news', this)">Главная</button>
        <button type="button" class="tab-pill" onclick="switchTab('calendar', this)">Календарь</button>
        <button type="button" class="tab-pill" onclick="switchTab('squad', this)">Состав</button>
        <button type="button" class="tab-pill" onclick="switchTab('shop', this)">Магазин</button>
    </nav>

    <!-- 1. ГЛАВНАЯ (ЧАТ УДАЛЕН, ЛАЙКИ И КОММЕНТЫ В КАРТОЧКАХ) -->
    <div id="screen-news" class="screen active">
        <div id="nextMatchWidgetContainer"></div>
        <div id="newsContainer"></div>
        
        <div class="admin-controls" id="admin-news">
            <h3 style="color:var(--primary); margin-bottom:10px;">🛠️ Настройка виджета ближайшей игры</h3>
            <input type="text" id="nmOpponent" class="admin-input" placeholder="Соперник (напр. Титан)">
            <input type="date" id="nmDateRaw" class="admin-input">
            <input type="text" id="nmArena" class="admin-input" placeholder="Место (напр. Домашняя арена)">
            <input type="file" id="nmLogoFile" class="admin-input" accept="image/*">
            <button type="button" class="admin-btn-save" onclick="saveNextMatch()">Сохранить анонс матча</button>

            <h3 style="color:var(--primary); margin:30px 0 10px;">🛠️ Добавить новость</h3>
            <input type="text" id="nTitle" class="admin-input" placeholder="Заголовок">
            <textarea id="nText" class="admin-input" placeholder="Текст"></textarea>
            <input type="text" id="nVideo" class="admin-input" placeholder="Ссылка на видео (YouTube или MP4)">
            <input type="file" id="nImgFile" class="admin-input" accept="image/*">
            <button type="button" class="admin-btn-save" onclick="saveNews()">Опубликовать новость</button>
        </div>
    </div>

    <!-- 2. КАЛЕНДАРЬ -->
    <div id="screen-calendar" class="screen">
        <div id="calendarContainer"></div>
        
        <div class="chat-section"><div class="chat-header">💬 Чат матчей</div><div class="chat-messages" id="chat-calendar"></div>
            <div class="chat-input-area"><input type="text" class="chat-input" id="input-calendar" placeholder="Написать сообщение..."><button type="button" class="chat-send" onclick="sendChat('calendar')">➤</button></div>
        </div>

        <div class="admin-controls" id="admin-calendar">
            <h3 style="color:var(--primary); margin-bottom:10px;">🛠️ Умный календарь событий</h3>
            <select id="mType" class="admin-input">
                <option value="match">🏒 Хоккейный Матч</option>
                <option value="BD">🎂 День рождения</option>
                <option value="event">📌 Другое событие</option>
            </select>
            <input type="text" id="mOpponent" class="admin-input" placeholder="Название события / Соперник">
            <input type="date" id="mDateRaw" class="admin-input">
            <div class="input-row">
                <input type="number" id="mScoreF" class="admin-input" placeholder="Счет Мы (если матч)">
                <input type="number" id="mScoreO" class="admin-input" placeholder="Счет Они (если матч)">
            </div>
            <input type="file" id="mLogoOFile" class="admin-input" accept="image/*">
            <button type="button" class="admin-btn-save" onclick="saveMatch()">Добавить в календарь</button>
        </div>
    </div>

    <!-- 3. СОСТАВ -->
    <div id="screen-squad" class="screen">
        <div class="field" id="fieldContainer"><div class="line-center"></div><div class="circle-center"></div><div class="goal-area goal-top"></div><div class="goal-area goal-bottom"></div></div>
        
        <div class="bench-header">Запасные игроки</div>
        <div class="bench-container" id="benchContainer"></div>

        <div class="chat-section" style="margin-bottom: 20px; margin-top: 20px;">
            <div class="chat-header">⭐ Фанатское голосование</div>
            <div class="vote-row"><select id="vote-player" class="vote-select"></select><input type="number" id="vote-score" class="vote-input" placeholder="0-99"></div>
            <button type="button" class="vote-btn" onclick="submitVote()">Проголосовать</button>
        </div>

        <div class="chat-section"><div class="chat-header">💬 Обсуждение состава</div><div class="chat-messages" id="chat-squad"></div>
            <div class="chat-input-area"><input type="text" class="chat-input" id="input-squad" placeholder="Кто должен играть?"><button type="button" class="chat-send" onclick="sendChat('squad')">➤</button></div>
        </div>

        <div class="admin-controls" id="admin-squad">
            <h3 style="color:var(--primary); margin-bottom:10px;">🛠️ Добавить/Обновить игрока</h3>
            <input type="text" id="pName" class="admin-input" placeholder="Фамилия">
            <div class="input-row">
                <input type="number" id="pRating" class="admin-input" placeholder="Баз. Рейтинг">
                <select id="pPos" class="admin-input" style="margin-bottom:0;" onchange="document.getElementById('pCustomPos').style.display = (this.value === 'bench' ? 'block' : 'none')">
                    <option value="pos-c">В старте: ЦН</option><option value="pos-lw">В старте: ЛН</option><option value="pos-rw">В старте: ПН</option>
                    <option value="pos-ld">В старте: ЛЗ</option><option value="pos-rd">В старте: ПЗ</option><option value="pos-gk">В старте: ВР</option>
                    <option value="bench">В ЗАПАС</option>
                </select>
            </div>
            <input type="text" id="pCustomPos" class="admin-input" placeholder="Позиция (напр. ЗАП ЦН)" style="display:none; margin-top:15px;">
            <input type="file" id="pPhotoFile" class="admin-input" accept="image/*" style="margin-top:15px;">
            <button type="button" class="admin-btn-save" onclick="savePlayer()">Сохранить игрока</button>
        </div>
    </div>

    <!-- 4. МАГАЗИН И ДИЗАЙН -->
    <div id="screen-shop" class="screen">
        <div class="shop-grid" id="shopContainer"></div>
        <div class="chat-section" style="margin-top: 20px;"><div class="chat-header">💬 Отзывы</div><div class="chat-messages" id="chat-shop"></div>
            <div class="chat-input-area"><input type="text" class="chat-input" id="input-shop" placeholder="Спросить про мерч..."><button type="button" class="chat-send" onclick="sendChat('shop')">➤</button></div>
        </div>

        <div class="admin-controls" id="admin-shop">
            <h3 style="color:var(--primary); margin-bottom:10px;">🛠️ Добавить товар</h3>
            <input type="text" id="sName" class="admin-input" placeholder="Название товара">
            <input type="text" id="sPrice" class="admin-input" placeholder="Цена">
            <input type="text" id="sEmoji" class="admin-input" placeholder="Эмодзи">
            <input type="file" id="sImgFile" class="admin-input" accept="image/*">
            <button type="button" class="admin-btn-save" onclick="saveShop()">В магазин</button>

            <h3 style="color:var(--primary); margin: 30px 0 10px;">🎨 Дизайн приложения</h3>
            <label style="color:#aaa; font-size:12px; margin-bottom:5px; display:block;">Загрузить новую эмблему клуба (в шапку и календарь):</label>
            <input type="file" id="logoImgFile" class="admin-input" accept="image/*">

            <label style="color:#aaa; font-size:12px; margin-bottom:5px; margin-top:15px; display:block;">Загрузить картинку фона:</label>
            <input type="file" id="bgImgFile" class="admin-input" accept="image/*">
            <button type="button" class="admin-btn-save" style="background:#555; margin-bottom:15px;" onclick="clearBgImg()">Убрать картинку фона</button>
            
            <label style="color:#aaa; font-size:12px; margin-bottom:5px; display:block;">Основной цвет:</label>
            <input type="color" id="primaryColorInput" class="admin-input" style="height:50px; padding:5px;">
            <button type="button" class="admin-btn-save" onclick="saveDesignSettings()">Сохранить дизайн</button>

            <h3 style="color:var(--primary); margin: 30px 0 10px;">🔗 Ссылки на соцсети</h3>
            <input type="text" id="tgLinkInput" class="admin-input" placeholder="Ссылка на Telegram">
            <input type="text" id="maxLinkInput" class="admin-input" placeholder="Ссылка на MAX">
            <button type="button" class="admin-btn-save" onclick="saveSocialLinks()">Сохранить соцсети</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsxGKTwHzLPwep_7EYiHHKAxsBwbJ-uEM",
            authDomain: "phoenix-9adab.firebaseapp.com",
            databaseURL: "https://phoenix-9adab-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "phoenix-9adab",
            storageBucket: "phoenix-9adab.firebasestorage.app",
            messagingSenderId: "935773473607",
            appId: "1:935773473607:web:4eecd7e05cd4ce2389da62"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdmin = false;
        let localData = { news: {}, matches: {}, shop: {}, players: {}, chats: { calendar: {}, squad: {}, shop: {} }, votes: {}, social: { tg: "#", max: "#" }, nextMatch: null, design: { color: "#ff5500", bg: "" } };
        const fanNames = ["Болельщик", "Фанат", "Ультрас", "PhoenixFan", "Игрок"];
        let openNewsComments = {}; 

        function toggleSocialMenu() { document.getElementById('socialModal').classList.toggle('active'); }

        function openPasswordModal() {
            document.getElementById('socialModal').classList.remove('active');
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('devPassInput').value = '';
        }

        function closePasswordModal() { document.getElementById('passwordModal').classList.remove('active'); }

        function checkDevPassword() {
            let pass = document.getElementById('devPassInput').value.trim();
            if(pass === "71633") {
                isAdmin = true;
                document.body.classList.add('is-admin');
                closePasswordModal();
                alert("Режим Бога активирован.");
                renderAll();
            } else {
                alert("Неверный пароль!");
            }
        }

        const refs = ['news', 'matches', 'shop', 'players', 'chats', 'votes', 'social', 'nextMatch', 'design'];
        refs.forEach(refName => {
            db.ref(refName).on('value', (snapshot) => {
                localData[refName] = snapshot.val() || (refName === 'social' ? {tg:"#", max:"#"} : (refName === 'design' ? {color:"#ff5500", bg:""} : {}));
                renderAll();
            });
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function formatDateReadable(dateStr) {
            if(!dateStr) return "Дата не указана";
            let parts = dateStr.split('-');
            if(parts.length !== 3) return dateStr;
            let months = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
        }

        function likeNews(id) {
            let likedArray = JSON.parse(localStorage.getItem('phx_liked_news') || '[]');
            if(likedArray.includes(id)) {
                alert("Вы уже оценили эту новость!");
                return;
            }
            let current = (localData.news[id] && localData.news[id].likes) ? localData.news[id].likes : 0;
            db.ref('news/' + id + '/likes').set(current + 1);
            likedArray.push(id);
            localStorage.setItem('phx_liked_news', JSON.stringify(likedArray));
        }
        
        function toggleNewsComments(id) {
            openNewsComments[id] = !openNewsComments[id];
            renderAll();
        }
        
        function sendNewsComment(id) {
            let input = document.getElementById('nc-input-' + id);
            if(input && input.value.trim()) {
                db.ref('news/' + id + '/comments').push({ name: fanNames[Math.floor(Math.random() * fanNames.length)] + Math.floor(Math.random() * 99), text: input.value.trim() });
                input.value = '';
                openNewsComments[id] = true;
            }
        }

        function renderAll() {
            const des = localData.design || { color: "#ff5500", bg: "", logo: "" };
            document.documentElement.style.setProperty('--primary', des.color);
            document.getElementById('glow1').style.background = des.color + '88';
            document.getElementById('glow2').style.background = des.color + '88';
            document.body.style.backgroundImage = des.bg ? `url('${des.bg}')` : 'none';
            document.getElementById('mainLogoElement').src = des.logo || '1335.jpg';
            if(document.getElementById('primaryColorInput')) document.getElementById('primaryColorInput').value = des.color;

            const nm = localData.nextMatch;
            const nmContainer = document.getElementById('nextMatchWidgetContainer');
            if(nm) {
                let nmL = nm.logo ? `<img src="${nm.logo}">` : '🛡️';
                let myLogo = des.logo ? `<img src="${des.logo}">` : `<img src="1335.jpg">`;
                nmContainer.innerHTML = `
                    <div class="next-match-widget">
                        <button type="button" class="delete-btn" style="${isAdmin?'display:flex;':''}" onclick="deleteItem('nextMatch', '')">✖</button>
                        <div class="next-match-title"><span>🔥 Ближайший матч</span><span>${formatDateReadable(nm.date)}</span></div>
                        <div class="next-match-teams">
                            <div class="nm-team"><div class="nm-logo">${myLogo}</div><span>Феникс</span></div>
                            <div class="nm-vs">VS</div>
                            <div class="nm-team"><span>${nm.opponent}</span><div class="nm-logo">${nmL}</div></div>
                        </div>
                        <div class="nm-info">📍 ${nm.arena || 'Арена'}</div>
                    </div>
                `;
            } else { nmContainer.innerHTML = ''; }

            const soc = localData.social || { tg: "https://t.me/Phoenix_floorballteam", max: "https://max.ru/join/3NZROyrUf3vVG _ztCdQHrhGD8BGFym4kbaaW4ql_GNM" };
            document.getElementById('socialLinksContainer').innerHTML = `
                <a href="${soc.tg}" target="_blank" class="social-link">Мы в Telegram</a>
                <a href="${soc.max}" target="_blank" class="social-link">Мы в MAX</a>
            `;
            if(document.getElementById('tgLinkInput')) { document.getElementById('tgLinkInput').value = soc.tg; document.getElementById('maxLinkInput').value = soc.max; }

            const newsArr = Object.entries(localData.news || {});
            document.getElementById('newsContainer').innerHTML = newsArr.map(([id, n]) => {
                let delBtn = isAdmin ? `<button type="button" class="delete-btn" onclick="deleteItem('news', '${id}')">✖</button>` : '';
                let mediaHtml = '';
                if(n.video) {
                    if(n.video.includes('youtube.com') || n.video.includes('youtu.be')) {
                        let vidId = n.video.split('v=')[1] || n.video.split('youtu.be/')[1];
                        if(vidId) vidId = vidId.split('&')[0];
                        mediaHtml = `<iframe class="news-video" height="220" src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe>`;
                    } else {
                        mediaHtml = `<video class="news-video" controls><source src="${n.video}" type="video/mp4"></video>`;
                    }
                }
                
                let likes = n.likes || 0;
                let commentsObj = n.comments || {};
                let commentsCount = Object.keys(commentsObj).length;
                let commentsHtml = Object.entries(commentsObj).map(([cId, c]) => `
                    <div class="news-comment">
                        <div class="nc-name">${c.name}</div>
                        <div class="nc-text">${c.text}</div>
                        ${isAdmin ? `<span class="nc-del" onclick="deleteItem('news/${id}/comments', '${cId}')">✖</span>` : ''}
                    </div>
                `).join('');

                let interactionPanel = `
                    <div class="news-actions">
                        <button type="button" class="na-btn" onclick="likeNews('${id}')">❤️ ${likes}</button>
                        <button type="button" class="na-btn" onclick="toggleNewsComments('${id}')">💬 ${commentsCount}</button>
                    </div>
                    <div class="news-comments-section" style="display: ${openNewsComments[id] ? 'block' : 'none'};">
                        <div class="nc-list">${commentsHtml}</div>
                        <div class="nc-input-row">
                            <input type="text" id="nc-input-${id}" placeholder="Ваш комментарий..." class="nc-input">
                            <button type="button" class="nc-send" onclick="sendNewsComment('${id}')">➤</button>
                        </div>
                    </div>
                `;

                let imgHtml = n.img ? `<img src="${n.img}" class="news-main-img">` : '';
                return `<div class="glass-card">${delBtn}${imgHtml}<div class="news-date">${n.date}</div><div class="news-title">${n.title}</div><div class="news-text">${n.text}</div>${mediaHtml}${interactionPanel}</div>`;
            }).reverse().join('');

            let matchesArr = Object.entries(localData.matches || {});
            matchesArr.sort((a, b) => new Date(a[1].date || '1970-01-01') - new Date(b[1].date || '1970-01-01'));
            document.getElementById('calendarContainer').innerHTML = matchesArr.map(([id, m]) => {
                let delBtn = isAdmin ? `<button type="button" class="delete-btn" onclick="deleteItem('matches', '${id}')">✖</button>` : '';
                let formattedDate = formatDateReadable(m.date);

                if(m.type === 'BD') {
                    return `<div class="glass-card" style="border-color: #ffd700; background: linear-gradient(135deg, rgba(255,215,0,0.1) 0%, rgba(0,0,0,0.6) 100%);">${delBtn}<div class="match-header" style="color: #ffd700;">🎂 День Рождения • ${formattedDate}</div><div style="text-align: center; font-size: 18px; font-weight: 800; padding: 10px 0;">🎉 ${m.opponent} 🎉</div></div>`;
                } else if(m.type === 'event') {
                    return `<div class="glass-card" style="border-color: #00ffff;">${delBtn}<div class="match-header" style="color: #00ffff;">📌 Событие • ${formattedDate}</div><div style="text-align: center; font-size: 18px; font-weight: 800; padding: 10px 0;">${m.opponent}</div></div>`;
                } else {
                    let myLogo = des.logo ? `<img src="${des.logo}">` : `<img src="1335.jpg">`;
                    let lo = m.logoO ? `<img src="${m.logoO}">` : '🛡️';
                    let statusText = (m.scoreF !== "-" && m.scoreF !== undefined && m.scoreF !== "") ? "Завершен" : "Ожидается";
                    return `<div class="glass-card">${delBtn}<div class="match-header">🏒 Матч • ${formattedDate}</div><div class="match-row"><div class="team-block"><div class="team-logo">${myLogo}</div><div class="team-name">Феникс</div></div><div class="score-block"><div class="score-pill">${m.scoreF} : ${m.scoreO}</div><div class="match-time">${statusText}</div></div><div class="team-block"><div class="team-logo">${lo}</div><div class="team-name">${m.opponent}</div></div></div></div>`;
                }
            }).join('');

            document.getElementById('shopContainer').innerHTML = Object.entries(localData.shop || {}).map(([id, s]) => {
                let imgTag = s.img.startsWith('data:') ? `<img src="${s.img}" class="shop-img">` : `<div class="shop-img">${s.img}</div>`;
                let delBtn = isAdmin ? `<button type="button" class="delete-btn" onclick="deleteItem('shop', '${id}')">✖</button>` : '';
                return `<div class="glass-card shop-item">${delBtn}${imgTag}<div class="shop-title">${s.name}</div><div class="shop-price">${s.price}</div></div>`;
            }).reverse().join('');

            let field = document.getElementById('fieldContainer');
            let bench = document.getElementById('benchContainer');
            field.querySelectorAll('.player-card').forEach(c => c.remove());
            bench.innerHTML = '';
            
            let voteSelectHtml = "";
            Object.entries(localData.players || {}).forEach(([id, p]) => {
                let rating = p.baseRating;
                if(localData.votes && localData.votes[id]) {
                    let sum = rating; let count = 1;
                    Object.values(localData.votes[id]).forEach(v => { sum += v; count++; });
                    rating = Math.round(sum / count);
                }

                let bg = p.photo ? `url('${p.photo}')` : `url('https://ui-avatars.com/api/?name=${p.name}&background=111&color=fff')`;
                let delBtn = isAdmin ? `<button type="button" class="delete-btn" onclick="deleteItem('players', '${id}')">✖</button>` : '';
                let cardHtml = `${delBtn}<div class="card-rating">${rating}</div><div class="card-pos">${p.posName}</div><div class="card-photo" style="background-image: ${bg}"></div><div class="card-name">${p.name}</div>`;
                
                if (id.startsWith('pos-')) {
                    let card = document.createElement('div'); card.className = `player-card ${id}`;
                    card.innerHTML = cardHtml; field.appendChild(card);
                } else {
                    let card = document.createElement('div'); card.className = `player-card bench`;
                    card.innerHTML = cardHtml; bench.appendChild(card);
                }
                voteSelectHtml += `<option value="${id}">${p.posName}: ${p.name}</option>`;
            });
            document.getElementById('vote-player').innerHTML = voteSelectHtml;

            ['calendar', 'squad', 'shop'].forEach(room => {
                const container = document.getElementById(`chat-${room}`);
                if (!container || !localData.chats[room]) return;
                container.innerHTML = Object.entries(localData.chats[room]).map(([id, msg]) => {
                    let delBtn = isAdmin ? `<button type="button" class="delete-btn" onclick="deleteItem('chats/${room}', '${id}')">✖</button>` : '';
                    return `<div class="msg"><div class="msg-avatar">${msg.name.charAt(0)}</div><div class="msg-content">${delBtn}<div class="msg-name">${msg.name}</div><div class="msg-text">${msg.text}</div></div></div>`;
                }).join('');
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendChat(room) {
            const input = document.getElementById(`input-${room}`);
            if(input.value.trim()) {
                db.ref(`chats/${room}`).push({ name: fanNames[Math.floor(Math.random() * fanNames.length)] + Math.floor(Math.random() * 99), text: input.value.trim() });
                input.value = '';
            }
        }

        function submitVote() {
            const pos = document.getElementById('vote-player').value;
            const score = parseInt(document.getElementById('vote-score').value);
            if(score > 0 && score <= 99) {
                db.ref(`votes/${pos}`).push(score);
                document.getElementById('vote-score').value = '';
                alert("Голос улетел в облако!");
            }
        }

        function deleteItem(path, id) {
            if(id === '') { db.ref(path).remove(); }
            else if(confirm("Удалить навсегда?")) { db.ref(`${path}/${id}`).remove(); }
        }

        function processFilePromise(inputId) {
            return new Promise((resolve) => {
                let file = document.getElementById(inputId).files[0];
                if (!file) { resolve(""); return; }
                const r = new FileReader();
                r.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height; 
                        if(w > 600) { h = Math.round(h * (600 / w)); w = 600; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    }; img.src = e.target.result;
                }; r.readAsDataURL(file);
            });
        }

        async function saveNextMatch() {
            let opp = document.getElementById('nmOpponent').value;
            if(!opp) return;
            let logoData = await processFilePromise('nmLogoFile');
            db.ref('nextMatch').set({ opponent: opp, date: document.getElementById('nmDateRaw').value, arena: document.getElementById('nmArena').value, logo: logoData });
            document.querySelectorAll('#admin-news input').forEach(i => { if(i.id.startsWith('nm')) i.value = ''; });
            alert("Анонс матча обновлен!");
        }

        async function saveNews() {
            let title = document.getElementById('nTitle').value;
            if(!title) return;
            let imgData = await processFilePromise('nImgFile');
            db.ref('news').push({ date: new Date().toLocaleDateString(), title: title, text: document.getElementById('nText').value, video: document.getElementById('nVideo').value, img: imgData, likes: 0 });
            document.querySelectorAll('#admin-news input[type="text"], #admin-news textarea, #admin-news input[type="file"]').forEach(i => { if(!i.id.startsWith('nm')) i.value = ''; });
        }

        async function saveMatch() {
            let imgData = await processFilePromise('mLogoOFile');
            let type = document.getElementById('mType').value;
            let sf = document.getElementById('mScoreF').value, so = document.getElementById('mScoreO').value;
            db.ref('matches').push({ type: type, opponent: document.getElementById('mOpponent').value, date: document.getElementById('mDateRaw').value, scoreF: sf || "-", scoreO: so || "-", logoO: imgData });
            document.querySelectorAll('#admin-calendar input[type="text"], #admin-calendar input[type="date"], #admin-calendar input[type="number"], #admin-calendar input[type="file"]').forEach(i => i.value = '');
            alert("Событие добавлено в календарь!");
        }

        async function savePlayer() {
            let n = document.getElementById('pName').value, r = document.getElementById('pRating').value, pos = document.getElementById('pPos').value;
            let customPos = document.getElementById('pCustomPos').value;
            let posNames = {"pos-c":"ЦН", "pos-lw":"ЛН", "pos-rw":"ПН", "pos-ld":"ЛЗ", "pos-rd":"ПЗ", "pos-gk":"ВР"};
            let imgData = await processFilePromise('pPhotoFile');
            let photo = imgData;
            if(pos !== 'bench' && !photo && localData.players && localData.players[pos]) photo = localData.players[pos].photo;
            let playerData = { name: n, baseRating: parseInt(r), posName: (pos === 'bench' && customPos) ? customPos : posNames[pos], photo: photo || "" };
            if (pos === 'bench') { db.ref('players').push(playerData); } else { db.ref(`players/${pos}`).set(playerData); }
            document.querySelectorAll('#admin-squad input').forEach(i => i.value = '');
        }

        async function saveShop() {
            let imgData = await processFilePromise('sImgFile');
            db.ref('shop').push({ name: document.getElementById('sName').value, price: document.getElementById('sPrice').value, img: imgData || document.getElementById('sEmoji').value || "📦" });
            document.querySelectorAll('#admin-shop input[type="text"], #admin-shop input[type="file"]').forEach(i => i.value = '');
        }

        function saveSocialLinks() {
            db.ref('social').set({ tg: document.getElementById('tgLinkInput').value.trim() || "#", max: document.getElementById('maxLinkInput').value.trim() || "#" });
            alert("Ссылки на соцсети сохранены!");
        }

        async function saveDesignSettings() {
            let color = document.getElementById('primaryColorInput').value;
            let bgData = await processFilePromise('bgImgFile');
            let logoData = await processFilePromise('logoImgFile');
            
            let currentBg = localData.design && localData.design.bg ? localData.design.bg : "";
            let currentLogo = localData.design && localData.design.logo ? localData.design.logo : "";
            
            db.ref('design').set({ color: color, bg: bgData || currentBg, logo: logoData || currentLogo });
            alert("Настройки дизайна сохранены!");
        }

        function clearBgImg() {
            let currentLogo = localData.design && localData.design.logo ? localData.design.logo : "";
            db.ref('design').set({ color: document.getElementById('primaryColorInput').value, bg: "", logo: currentLogo });
            alert("Фоновая картинка удалена!");
        }
    </script>
</body>
</html>
