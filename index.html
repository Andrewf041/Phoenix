<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПХК Феникс - Premium</title>
    <style>
        :root {
            --primary: #ff5500;
            --primary-glow: rgba(255, 85, 0, 0.6);
            --bg-dark: #050301;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed; }

        .ambient-glow { position: fixed; width: 350px; height: 350px; background: var(--primary); filter: blur(120px); border-radius: 50%; opacity: 0.25; z-index: -1; pointer-events: none; }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 10%; right: -150px; opacity: 0.2; }

        .header { display: flex; justify-content: center; align-items: center; padding: 15px 20px 10px; position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(5,3,1,0.98) 0%, rgba(5,3,1,0) 100%); height: 95px; }
        .logo-img-main { height: 80px; width: auto; object-fit: contain; filter: drop-shadow(0 0 15px var(--primary-glow)); }
        .fallback-logo { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--primary-glow); letter-spacing: 2px; align-items: center; display: none; }
        .admin-btn-header { position: absolute; right: 20px; top: 25px; height: 40px; width: 40px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); font-size: 18px; cursor: pointer; color: #fff; transition: 0.3s; }

        .top-nav { display: flex; gap: 12px; overflow-x: auto; padding: 10px 20px 20px; scrollbar-width: none; z-index: 99; position: relative; }
        .top-nav::-webkit-scrollbar { display: none; }
        .tab-pill { background: var(--glass-bg); color: var(--text-muted); border: 1px solid var(--glass-border); padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; backdrop-filter: blur(10px); }
        .tab-pill.active { background: rgba(0,0,0,0.6); color: var(--text-main); border-color: var(--primary); box-shadow: inset 0 0 15px rgba(255,255,255,0.02), 0 0 12px var(--primary-glow); }

        .screen { display: none; padding: 0 20px 40px; animation: scaleIn 0.3s ease-out; }
        .screen.active { display: block; }
        @keyframes scaleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 28px; padding: 20px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative; overflow: hidden; }

        /* Новости, Календарь, Магазин - без изменений стилей, они уже идеальны */
        .featured-news { padding: 0; min-height: 240px; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; border: 1px solid var(--primary); }
        .featured-overlay { background: linear-gradient(0deg, #000 0%, transparent 100%); padding: 25px 20px; border-radius: 0 0 28px 28px; }
        .news-date { font-size: 11px; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .news-title { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
        .news-text { font-size: 14px; color: #ccc; line-height: 1.4; }

        .match-header { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; }
        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .team-block { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .team-logo { width: 55px; height: 55px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 26px; border: 1px solid var(--glass-border); overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
        .team-name { font-size: 13px; font-weight: 700; text-align: center; }
        .score-block { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .score-pill { background: rgba(0,0,0,0.6); border: 1px solid var(--primary); border-radius: 20px; padding: 8px 24px; font-size: 26px; font-weight: 900; box-shadow: 0 0 20px var(--primary-glow); margin-bottom: 6px; }
        .match-time { font-size: 12px; color: var(--primary); font-weight: 700; }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .shop-img { width: 80px; height: 80px; margin-bottom: 12px; object-fit: contain; font-size: 55px; line-height: 80px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        .shop-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #eee; }
        .shop-price { font-size: 17px; font-weight: 900; color: var(--primary); }

        /* Поле */
        .field { background: linear-gradient(180deg, #16181f 0%, #0d0e12 100%); border: 2px solid var(--glass-border); border-radius: 28px; height: 520px; position: relative; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.9); margin-top: 10px; margin-bottom: 20px;}
        .line-center { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.15); transform: translateY(-50%); }
        .circle-center { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal-area { position: absolute; left: 50%; width: 140px; height: 45px; border: 2px solid rgba(255,255,255,0.15); transform: translateX(-50%); }
        .goal-top { top: -2px; border-top: none; border-radius: 0 0 25px 25px; }
        .goal-bottom { bottom: -2px; border-bottom: none; border-radius: 25px 25px 0 0; }
        .player-card { width: 72px; height: 110px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border: 1px solid var(--primary); border-radius: 12px; position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; padding: 6px 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .card-rating { font-size: 19px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 0 10px var(--primary-glow); }
        .card-pos { font-size: 10px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .card-photo { width: 44px; height: 44px; background: #222; border-radius: 50%; background-size: cover; background-position: center; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.3); }
        .card-name { font-size: 10px; font-weight: 700; color: #eee; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .pos-c { top: 22%; left: 50%; } .pos-lw { top: 38%; left: 22%; } .pos-rw { top: 38%; left: 78%; } .pos-ld { top: 68%; left: 28%; } .pos-rd { top: 68%; left: 72%; } .pos-gk { top: 88%; left: 50%; }

        /* === НОВЫЕ СТИЛИ ЧАТА === */
        .chat-section { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 28px; padding: 20px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 10px; }
        .chat-header { font-size: 16px; font-weight: 800; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .chat-messages { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; padding-right: 5px; }
        .msg { display: flex; gap: 12px; align-items: flex-end; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #aa3300); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(255,85,0,0.3); }
        .msg-content { background: rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 20px 20px 20px 0; border: 1px solid rgba(255,255,255,0.05); max-width: 85%; }
        .msg-name { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .msg-text { font-size: 14px; color: #fff; line-height: 1.3; }
        .chat-input-area { display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 30px; border: 1px solid var(--glass-border); }
        .chat-input { flex-grow: 1; background: transparent; border: none; color: #fff; padding: 10px 15px; font-size: 14px; outline: none; }
        .chat-send { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px var(--primary-glow); }

        /* === БЛОК ГОЛОСОВАНИЯ === */
        .vote-section { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .vote-row { display: flex; gap: 10px; }
        .vote-select { flex-grow: 2; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--glass-border); padding: 14px; border-radius: 16px; outline: none; }
        .vote-input { flex-grow: 1; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--glass-border); padding: 14px; border-radius: 16px; text-align: center; outline: none; width: 80px; }
        .vote-btn { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 15px var(--primary-glow); }

        /* Админка (скрыта для экономии места, стили те же) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(20px); }
        .modal-overlay.active { display: flex; animation: scaleIn 0.2s; }
        .modal-content { background: linear-gradient(145deg, #1a1c23 0%, #111216 100%); width: 100%; max-width: 420px; border-radius: 32px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .admin-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 5px; scrollbar-width: none; }
        .admin-tabs::-webkit-scrollbar { display: none; }
        .admin-tab { background: #000; border: 1px solid #333; color: #888; padding: 12px 16px; border-radius: 14px; white-space: nowrap; cursor: pointer; font-weight: 700; font-size: 13px; }
        .admin-tab.active { background: rgba(255,85,0,0.15); color: var(--primary); border-color: var(--primary); }
        .admin-input { width: 100%; padding: 16px; background: #08090b; color: #fff; border: 1px solid #2a2d35; border-radius: 16px; margin-bottom: 15px; font-size: 14px; }
        .admin-btn-save { background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .form-group { display: none; }
        .form-group.active { display: block; }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1" id="glow1"></div>
    <div class="ambient-glow glow-2" id="glow2"></div>

    <header class="header">
        <img src="1335.jpg" alt="ФЕНИКС" class="logo-img-main" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
        <div id="fallbackLogo" class="fallback-logo">🦅 ФЕНИКС</div>
        <button class="admin-btn-header" onclick="openAdmin()">⚙️</button>
    </header>

    <nav class="top-nav">
        <button class="tab-pill active" onclick="switchTab('news', this)">Главная</button>
        <button class="tab-pill" onclick="switchTab('calendar', this)">Календарь</button>
        <button class="tab-pill" onclick="switchTab('squad', this)">Состав</button>
        <button class="tab-pill" onclick="switchTab('shop', this)">Магазин</button>
    </nav>

    <!-- 1. НОВОСТИ -->
    <div id="screen-news" class="screen active">
        <div id="newsContainer"></div>
        <div class="chat-section">
            <div class="chat-header">💬 Обсуждение новостей</div>
            <div class="chat-messages" id="chat-news"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="input-news" placeholder="Написать сообщение...">
                <button class="chat-send" onclick="sendChat('news')">➤</button>
            </div>
        </div>
    </div>

    <!-- 2. КАЛЕНДАРЬ -->
    <div id="screen-calendar" class="screen">
        <div id="calendarContainer"></div>
        <div class="chat-section">
            <div class="chat-header">💬 Чат матчей</div>
            <div class="chat-messages" id="chat-calendar"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="input-calendar" placeholder="Написать сообщение...">
                <button class="chat-send" onclick="sendChat('calendar')">➤</button>
            </div>
        </div>
    </div>

    <!-- 3. СОСТАВ И РЕЙТИНГ -->
    <div id="screen-squad" class="screen">
        <div class="field" id="fieldContainer">
            <div class="line-center"></div><div class="circle-center"></div>
            <div class="goal-area goal-top"></div><div class="goal-area goal-bottom"></div>
        </div>
        
        <!-- Голосование фанатов -->
        <div class="chat-section" style="margin-bottom: 20px;">
            <div class="chat-header">⭐ Фанатское голосование</div>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 12px;">Выбери игрока и предложи свой рейтинг. Оценка на поле — это средний балл всех фанатов!</p>
            <div class="vote-section">
                <div class="vote-row">
                    <select id="vote-player" class="vote-select"></select>
                    <input type="number" id="vote-score" class="vote-input" placeholder="0-99" min="1" max="99">
                </div>
                <button class="vote-btn" onclick="submitVote()">Проголосовать</button>
            </div>
        </div>

        <!-- Чат состава -->
        <div class="chat-section">
            <div class="chat-header">💬 Обсуждение состава</div>
            <div class="chat-messages" id="chat-squad"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="input-squad" placeholder="Кто должен играть в старте?">
                <button class="chat-send" onclick="sendChat('squad')">➤</button>
            </div>
        </div>
    </div>

    <!-- 4. МАГАЗИН -->
    <div id="screen-shop" class="screen">
        <div class="shop-grid" id="shopContainer"></div>
        <div class="chat-section" style="margin-top: 20px;">
            <div class="chat-header">💬 Отзывы и вопросы</div>
            <div class="chat-messages" id="chat-shop"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="input-shop" placeholder="Спросить про мерч...">
                <button class="chat-send" onclick="sendChat('shop')">➤</button>
            </div>
        </div>
    </div>

    <!-- Админ-панель (Оставил только нужные поля для компактности кода) -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: #fff; font-size: 20px; font-weight: 800;">Управление клубом</h3>
                <button class="close-btn" onclick="closeAdmin()">×</button>
            </div>
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="setAdminForm('form-news', this)">📰 Новость</button>
                <button class="admin-tab" onclick="setAdminForm('form-match', this)">📅 Матч</button>
                <button class="admin-tab" onclick="setAdminForm('form-player', this)">🏒 Игрок</button>
                <button class="admin-tab" onclick="setAdminForm('form-settings', this)">🎨 Дизайн</button>
            </div>
            
            <div id="form-news" class="form-group active">
                <input type="text" id="nTitle" class="admin-input" placeholder="Заголовок">
                <textarea id="nText" class="admin-input" placeholder="Текст"></textarea>
            </div>
            <div id="form-match" class="form-group">
                <input type="text" id="mOpponent" class="admin-input" placeholder="Соперник">
                <input type="text" id="mDate" class="admin-input" placeholder="Дата">
                <input type="number" id="mScoreF" class="admin-input" placeholder="Счет Мы">
                <input type="number" id="mScoreO" class="admin-input" placeholder="Счет Они">
            </div>
            <div id="form-player" class="form-group">
                <input type="text" id="pName" class="admin-input" placeholder="Фамилия">
                <select id="pPos" class="admin-input">
                    <option value="pos-c">ЦН</option><option value="pos-lw">ЛН</option><option value="pos-rw">ПН</option>
                    <option value="pos-ld">ЛЗ</option><option value="pos-rd">ПЗ</option><option value="pos-gk">ВР</option>
                </select>
            </div>
            <div id="form-settings" class="form-group">
                <input type="color" id="gColor" class="admin-input" style="height: 50px;">
                <button class="admin-btn-save" style="background:#cc0000; margin-top:20px;" onclick="localStorage.clear(); location.reload();">Сбросить всё</button>
            </div>

            <button class="admin-btn-save" onclick="saveData()">💾 Сохранить</button>
        </div>
    </div>

    <script>
        const fanNames = ["Болельщик", "Фанат", "Ультрас", "PhoenixFan"];
        
        let db = {
            news: JSON.parse(localStorage.getItem('phx_news_v8')) || [{ date: "Сегодня", title: "Победа в дерби!", text: "Феникс вырывает невероятную победу!" }],
            matches: JSON.parse(localStorage.getItem('phx_matches_v8')) || [{ date: "20 Окт, 18:00", opponent: "Титан", scoreF: "4", scoreO: "2", status: "Завершен", logoO: "" }],
            shop: JSON.parse(localStorage.getItem('phx_shop_v8')) || [{ name: "Джерси", price: "2 500 ₽", img: "👕" }],
            players: JSON.parse(localStorage.getItem('phx_players_v8')) || [
                { name: "Петров", baseRating: 88, pos: "pos-c", posName: "ЦН", photo: "" },
                { name: "Сидоров", baseRating: 85, pos: "pos-lw", posName: "ЛН", photo: "" },
                { name: "Иванов", baseRating: 82, pos: "pos-rw", posName: "ПН", photo: "" },
                { name: "Смирнов", baseRating: 86, pos: "pos-ld", posName: "ЛЗ", photo: "" },
                { name: "Соколов", baseRating: 81, pos: "pos-rd", posName: "ПЗ", photo: "" },
                { name: "Давидонис", baseRating: 91, pos: "pos-gk", posName: "ВР", photo: "" }
            ],
            design: JSON.parse(localStorage.getItem('phx_design_v8')) || { color: "#ff5500", bg: "" },
            chats: JSON.parse(localStorage.getItem('phx_chats_v8')) || { news: [], calendar: [], squad: [], shop: [] },
            votes: JSON.parse(localStorage.getItem('phx_votes_v8')) || {} // Структура: { "pos-c": [88, 90, 89] }
        };

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // Рендер Чатов
        function renderChats() {
            ['news', 'calendar', 'squad', 'shop'].forEach(room => {
                const container = document.getElementById(`chat-${room}`);
                if (!container) return;
                container.innerHTML = db.chats[room].map(msg => `
                    <div class="msg">
                        <div class="msg-avatar">${msg.name.charAt(0)}</div>
                        <div class="msg-content">
                            <div class="msg-name">${msg.name}</div>
                            <div class="msg-text">${msg.text}</div>
                        </div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight; // Скролл вниз
            });
        }

        function sendChat(room) {
            const input = document.getElementById(`input-${room}`);
            const text = input.value.trim();
            if(text) {
                const randomName = fanNames[Math.floor(Math.random() * fanNames.length)] + Math.floor(Math.random() * 99);
                db.chats[room].push({ name: randomName, text: text });
                localStorage.setItem('phx_chats_v8', JSON.stringify(db.chats));
                input.value = '';
                renderChats();
            }
        }

        // Логика голосования за рейтинг
        function renderVoteSelect() {
            const select = document.getElementById('vote-player');
            select.innerHTML = db.players.map(p => `<option value="${p.pos}">${p.posName}: ${p.name}</option>`).join('');
        }

        function submitVote() {
            const pos = document.getElementById('vote-player').value;
            const score = parseInt(document.getElementById('vote-score').value);
            
            if(score > 0 && score <= 99) {
                if(!db.votes[pos]) db.votes[pos] = [];
                db.votes[pos].push(score);
                localStorage.setItem('phx_votes_v8', JSON.stringify(db.votes));
                document.getElementById('vote-score').value = '';
                alert("Твой голос учтен! Рейтинг игрока пересчитан.");
                renderAll(); // Перерисовываем поле с новыми оценками
            } else {
                alert("Введи рейтинг от 1 до 99");
            }
        }

        // Вычисление итогового рейтинга (Базовый + среднее от фанатов)
        function getPlayerRating(player) {
            if(!db.votes[player.pos] || db.votes[player.pos].length === 0) return player.baseRating;
            
            let sum = player.baseRating; // Учитываем базовый рейтинг как первый голос
            db.votes[player.pos].forEach(v => sum += v);
            let avg = Math.round(sum / (db.votes[player.pos].length + 1));
            return avg;
        }

        function renderAll() {
            document.documentElement.style.setProperty('--primary', db.design.color);
            document.getElementById('glow1').style.background = db.design.color + '88';
            document.getElementById('glow2').style.background = db.design.color + '88';

            // Контент (упрощен для компактности)
            document.getElementById('newsContainer').innerHTML = db.news.map(n => `<div class="glass-card"><div class="news-title">${n.title}</div><div class="news-text">${n.text}</div></div>`).reverse().join('');
            document.getElementById('calendarContainer').innerHTML = db.matches.map(m => `<div class="glass-card"><div class="match-row"><div class="team-block"><div class="team-name">Феникс</div></div><div class="score-pill">${m.scoreF} : ${m.scoreO}</div><div class="team-block"><div class="team-name">${m.opponent}</div></div></div></div>`).reverse().join('');
            document.getElementById('shopContainer').innerHTML = db.shop.map(s => `<div class="glass-card shop-item"><div class="shop-img">${s.img}</div><div class="shop-title">${s.name}</div><div class="shop-price">${s.price}</div></div>`).reverse().join('');

            // Поле состава с динамическим рейтингом!
            let field = document.getElementById('fieldContainer');
            field.querySelectorAll('.player-card').forEach(c => c.remove());
            db.players.forEach(p => {
                let currentRating = getPlayerRating(p); // Считаем рейтинг с учетом фанатов
                
                let card = document.createElement('div');
                card.className = `player-card ${p.pos}`;
                card.innerHTML = `
                    <div class="card-rating">${currentRating}</div>
                    <div class="card-pos">${p.posName}</div>
                    <div class="card-photo"></div>
                    <div class="card-name">${p.name}</div>
                `;
                field.appendChild(card);
            });

            renderChats();
            renderVoteSelect();
        }

        // Админка
        let currentAdminForm = 'form-news';
        function openAdmin() { if(prompt("Пароль (1234):") === "1234") document.getElementById('adminModal').classList.add('active'); }
        function closeAdmin() { document.getElementById('adminModal').classList.remove('active'); }
        function setAdminForm(id, btn) {
            currentAdminForm = id;
            document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active')); document.getElementById(id).classList.add('active');
        }

        function saveData() {
            if (currentAdminForm === 'form-news') {
                db.news.push({ date: "Только что", title: document.getElementById('nTitle').value, text: document.getElementById('nText').value });
            } else if (currentAdminForm === 'form-match') {
                db.matches.push({ date: document.getElementById('mDate').value, opponent: document.getElementById('mOpponent').value, scoreF: document.getElementById('mScoreF').value, scoreO: document.getElementById('mScoreO').value });
            } else if (currentAdminForm === 'form-settings') {
                db.design.color = document.getElementById('gColor').value;
            }
            
            localStorage.setItem('phx_news_v8', JSON.stringify(db.news));
            localStorage.setItem('phx_matches_v8', JSON.stringify(db.matches));
            localStorage.setItem('phx_design_v8', JSON.stringify(db.design));
            renderAll(); closeAdmin();
        }

        renderAll();
    </script>
</body>
</html>
